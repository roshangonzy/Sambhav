                    { q: "A single movable pulley has a V.R. of 2. If its efficiency is 100%, what effort is needed to lift a 100N load?", o: ["100 N", "50 N", "200 N", "0 N"], a: 1, e: "If eff=100%, M.A.=2. Effort = Load / M.A. = 100 / 2 = 50 N.", n: "In the mythical, frictionless world of 100% efficiency, a machine's theoretical Velocity Ratio perfectly matches its actual Mechanical Advantage. Therefore, this movable pulley boasts a flawless M.A. of exactly 2. This means the system will cleanly slice any required lifting effort in half. Confronted with a heavy 100 Newton load, the user only needs to apply a gentle 50 Newtons of upward tension to the rope. It represents perfect, mathematically uncorrupted force multiplication." },
                    { q: "In a practical movable pulley, if effort needed is 60N to lift a 100N load, what is its M.A.?", o: ["2", "1.66", "0.6", "1"], a: 1, e: "M.A. = Load / Effort = 100 / 60 = 1.66.", n: "Real-world pulleys are severely handicapped by the weight of the metal wheel itself and the harsh friction inside its bearings. While a theoretical movable pulley should halve a 100N load down to 50N, reality is much crueler. This specific rusty pulley demands a heavier 60N of sweating effort from the user. By dividing the 100N load by the 60N actual effort, the math exposes the truth. The machine's actual Mechanical Advantage is a mediocre 1.66, proving how heavily friction penalizes lifting." },
                    { q: "A block and tackle system has 5 pulleys. What is its Velocity Ratio?", o: ["2.5", "5", "10", "Depends on friction"], a: 1, e: "V.R. depends solely on the number of pulleys (strands supporting the lower block), which is 5.", n: "The Velocity Ratio of a pulley rig is beautifully immune to the chaotic variables of friction, rust, or heavy loads. It is a pure, unbreakable geometric constant dictated entirely by how the ropes are physically routed. In a standard block and tackle, the V.R. perfectly mirrors the total number of rope strands actively pulling up on the heavy bottom block. Generally, this directly equals the total number of spinning wheels in the system. With 5 wheels, you must agonizingly pull 5 meters of rope to lift the box 1 meter." },
                    { q: "If a machine overcomes a load of 500N using an effort of 100N, the M.A. is:", o: ["5", "0.2", "50000", "400"], a: 0, e: "M.A. = Load / Effort = 500 / 100 = 5.", n: "Calculating Mechanical Advantage is the ultimate, brutal assessment of a machine's actual helpfulness to a human operator. It simply demands you divide the massive, intimidating load you wish to lift by the fragile, human effort you actually had to supply. Here, the machine successfully shattered a 500 Newton obstacle while only taxing the user for 100 Newtons of push. The resulting clean division reveals a massive M.A. of 5. This machine successfully multiplied the user's biological strength by five times." },
                    { q: "To increase the efficiency of a block and tackle system, the lower block should be:", o: ["As heavy as possible", "As light as possible", "Made of iron", "Kept un-oiled"], a: 1, e: "A lighter movable block wastes less effort lifting the pulleys themselves.", n: "A massive, hidden flaw in complex pulley systems is that you aren't just lifting the heavy cargo; you must also lift the heavy metal pulleys strapped to it. Every ounce of iron in the movable lower block acts as a parasitic drain, stealing your input effort before it ever reaches the actual cargo. By aggressively re-engineering the lower block to be constructed from ultra-lightweight aluminum or composite plastics, you minimize this wasted effort. A lighter rig drastically boosts the system's final operating efficiency." },
                    { q: "A machine with V.R. = 4 and Efficiency = 75%. What is the Work Output if Work Input is 1000J?", o: ["750 J", "1000 J", "1333 J", "250 J"], a: 0, e: "Efficiency = Output / Input. 0.75 = Output / 1000. Output = 750 J.", n: "Efficiency acts as a merciless tax bracket on all mechanical energy traversing through a machine. The operator sweated to supply a massive 1,000 Joules of raw work input into the system. However, the machine's grinding gears and heavy pulleys boast a miserable 75% efficiency rating. This means a full 25% of the invested energy is brutally lost to thermal heat. The math proves that only a compromised 750 Joules will successfully survive to actually lift the heavy cargo." },
                    { q: "A crowbar of length 120cm has its fulcrum at 20cm from the load. The M.A. is:", o: ["5", "6", "4", "0.2"], a: 0, e: "Load arm=20cm. Effort arm=120-20=100cm. M.A. = Effort Arm / Load Arm = 100/20 = 5.", n: "Analyzing a crowbar requires mapping its crucial internal geometry. The tiny load arm is clearly defined by the 20cm gap between the rock and the pivot. However, the effort arm is not the full length of the bar; it is strictly the remaining 100cm distance from the pivot back to the user's pushing hands. Dividing that massive 100cm effort arm by the tiny 20cm load arm yields the golden multiplier. The crowbar boasts an impressive Mechanical Advantage of 5, ready to shatter concrete." },
                    { q: "In gears, if the driving wheel has 10 teeth and driven wheel has 30 teeth, it acts as a:", o: ["Speed multiplier", "Force multiplier", "Direction changer only", "None"], a: 1, e: "The larger driven wheel turns slower but with greater force (torque).", n: "Gear systems are masterful engineers of trading velocity for raw crushing torque. A tiny, high-speed driving motor with only 10 teeth meshes violently with a massive 30-tooth output wheel. Because the big wheel takes three full rotations of the small wheel just to spin once, its output speed is brutally slashed. However, the unbreakable laws of mechanics demand compensation. That sacrificed speed is instantly converted into a massive surge in rotational force, making it an exceptional force multiplier for heavy tanks or tractors." },
                    { q: "In the gear system above (10 driving, 30 driven), what is the gear ratio?", o: ["3", "1/3", "300", "20"], a: 0, e: "Gear Ratio = Number of teeth in driven / Number of teeth in driving = 30 / 10 = 3.", n: "The gear ratio is the absolute heartbeat of automotive and industrial transmission design. It is rigidly calculated by dividing the massive tooth count of the heavy driven wheel by the tiny tooth count of the driving motor. Dividing the 30 driven teeth by the 10 driving teeth yields a clean ratio of exactly 3. This magical number dictates that the output shaft will spin three times slower than the engine, but it will deliver roughly three times the twisting torque to the axles." },
                    { q: "A machine is irreversible (self-locking) if its efficiency is:", o: ["> 50%", "< 50%", "Exactly 100%", "0%"], a: 1, e: "If efficiency is less than 50%, friction is high enough to hold the load in place when effort is removed.", n: "In highly specific mechanical scenarios, aggressive internal friction is not a flaw, but a brilliant safety feature. If a machine's efficiency plummets below 50%, it means more than half of the input energy is actively being destroyed by internal grinding. This massive wall of friction works in both directions. If you suddenly let go of the handle, the immense internal friction is strong enough to completely paralyze the heavy load, preventing it from violently crashing back down. The machine locks itself." },
                    { q: "A screw jack is an example of an irreversible machine because:", o: ["Its M.A. is small", "Its V.R. is small", "Friction is very high", "It is very fast"], a: 2, e: "High friction (efficiency < 50%) keeps the car from falling when you let go of the handle.", n: "A mechanic's screw jack is uniquely engineered to leverage massive amounts of metallic friction for human safety. Lifting a two-ton vehicle requires immense effort precisely because the winding screw threads grind aggressively against each other, driving efficiency well below 50%. However, this intentional inefficiency is a lifesaver. When the mechanic stops winding and crawls under the car, that exact same massive friction utterly paralyzes the threads. It guarantees the two-ton vehicle will not spontaneously spin the jack backward and crush them." },
                    { q: "A single fixed pulley does not multiply force. Why is it used?", o: ["It looks nice", "It multiplies speed", "It applies effort in a convenient downward direction", "It has >100% efficiency"], a: 2, e: "It's much easier to use your body weight to pull down than to pull up.", n: "Human biology is poorly optimized for deadlifting heavy weights vertically upward against the sky. A single fixed pulley entirely ignores force multiplication in favor of extreme ergonomic convenience. By routing the lifting rope over a high, secure wheel, the operator is suddenly allowed to pull violently downward. This brilliant shift in geometry allows the worker to literally hang on the rope, utilizing their entire heavy body weight and planetary gravity to assist the lift. It transforms a back-breaking lift into a simple drop." },
                    { q: "The V.R. of an inclined plane of length L and height H is:", o: ["H / L", "L / H", "L × H", "L + H"], a: 1, e: "V.R. = Distance effort moves (L) / Distance load moves (H).", n: "The Velocity Ratio strictly analyzes the geometric punishment required to utilize a machine. For a wooden ramp, the effort must painfully drag the heavy crate across the entire, sweeping diagonal length (L) of the wood. Meanwhile, the actual, useful accomplishment is merely the tiny vertical height (H) the crate was lifted off the ground. Dividing that massive effort distance (L) by the tiny load distance (H) reveals the ramp's true V.R. It highlights the massive distance you must sacrifice for an easier push." },
                    { q: "A ramp is 10m long and 2m high. Its V.R. is:", o: ["0.2", "5", "20", "8"], a: 1, e: "V.R. = Length / Height = 10 / 2 = 5.", n: "Evaluating this specific ramp exposes the harsh reality of trading distance for power. To successfully elevate a heavy cargo box by a mere 2 vertical meters, the exhausted worker is forced to push it across a sprawling 10-meter diagonal slope. By dividing the massive 10-meter effort distance by the tiny 2-meter vertical reward, the math exposes a Velocity Ratio of 5. You must walk five times further than the actual height gained, but the pushing effort is significantly diluted." },
                    { q: "A force multiplier machine has:", o: ["M.A. > 1", "M.A. < 1", "M.A. = 1", "M.A. = 0"], a: 0, e: "It multiplies your effort, meaning the Load is bigger than the Effort (Load/Effort > 1).", n: "The ultimate dream of mechanical engineering is to construct a machine boasting a Mechanical Advantage greater than 1. This mathematical threshold guarantees that the machine is actively taking your weak, human input force and artificially inflating it. Because the heavy Load you are fighting is numerically larger than the tiny Effort you are applying, the resulting division (Load/Effort) easily exceeds 1. These force-multiplying behemoths, like hydraulic presses and long levers, are the absolute backbone of industrial construction." },
                    { q: "A speed multiplier machine has:", o: ["M.A. > 1", "M.A. < 1", "M.A. = 1", "M.A. = 0"], a: 1, e: "It sacrifices force (you push harder) to move the load a larger distance or faster.", n: "A machine cursed with a Mechanical Advantage below 1 initially looks like a tragic design flaw, forcing you to exert more effort than the load actually weighs. However, the laws of physics reward this brutal effort with blinding speed and massive reach. Because you are pushing so hard near the pivot, the far end of the machine violently sweeps through a massive arc in milliseconds. Baseball bats and catapults are classic speed multipliers, perfectly happy to trade brute force for explosive velocity." },
                    { q: "In a combination of one fixed and one movable pulley, the total V.R. is:", o: ["1", "2", "3", "4"], a: 1, e: "The movable pulley provides a V.R. of 2, the fixed one only changes direction.", n: "This classic two-pulley setup is the brilliant foundation of introductory hoisting mechanics. The heavy lower pulley physically rides the rope, cleanly slicing the required pulling force in half and establishing a base V.R. of 2. The upper fixed pulley bolted to the ceiling mathematically contributes absolutely nothing to force multiplication; its sole purpose is to comfortably reverse the pulling direction downward. Therefore, the system's total geometric Velocity Ratio remains stubbornly locked at 2. It is elegant simplicity." },
                    { q: "To lift a load of 400N using a block and tackle of V.R.=4 (eff=100%), the effort is:", o: ["400 N", "100 N", "1600 N", "50 N"], a: 1, e: "Ideal M.A. = V.R. = 4. Effort = Load/M.A. = 400/4 = 100 N.", n: "Operating in a hypothetical universe free from the tyranny of friction, a machine's Velocity Ratio becomes its actual Mechanical Advantage. This 4-pulley rig boasts a flawless M.A. of 4, promising to aggressively quarter any lifting effort. Confronted with a crushing 400-Newton safe, the operator simply divides that massive load by the machine's perfect multiplier of 4. The math proves the operator can effortlessly hoist the safe using a shockingly gentle 100-Newton downward pull. It is pure mechanical supremacy." },
                    { q: "Why is the efficiency of a practical movable pulley less than 100%?", o: ["Weight of the pulley and friction", "Gravity changes", "Air resistance", "Length of rope"], a: 0, e: "You waste some effort lifting the actual physical pulley wheel and overcoming axle friction.", n: "Theoretical physics often beautifully ignores the harsh realities of heavy steel and rusty bearings. In a real-world movable pulley, your sweating effort isn't exclusively dedicated to lifting the cargo. A significant percentage of your pull is instantly wasted dragging the heavy iron pulley wheel itself up into the air. Furthermore, the internal axle bearings aggressively grind together, converting even more of your effort into useless thermal heat. These two parasitic realities permanently drag the efficiency well below the 100% fantasy." },
                    { q: "An oar of a rowing boat is a lever of:", o: ["Class I", "Class II", "Class III", "Class IV"], a: 1, e: "The water acts as the fulcrum (pivot), the boat is the load in the middle, and you pull the handle (effort).", n: "Analyzing a rowing oar exposes a brilliant, counter-intuitive application of a Class II lever. While it looks like a see-saw, the flat blade of the oar actually anchors itself stubbornly against the heavy water, forming a temporary fulcrum. The rower violently hauls backward on the wooden handle, establishing the effort at the absolute farthest distance. This perfectly traps the heavy, resting boat (the load) in the middle between the water and the hands. This setup provides the massive force multiplication necessary to accelerate the hull." },
                    { q: "A wheel nut wrench (spanner) acts as a:", o: ["Lever", "Pulley", "Inclined plane", "Wedge"], a: 0, e: "It acts as a lever pivoting on the nut.", n: "A mechanic's wheel wrench is perhaps the purest, most aggressive everyday application of basic lever mechanics. The violently seized lug nut acts as the rigid, central fulcrum around which the entire metal shaft wants to pivot. The mechanic desperately throws their body weight onto the far end of the long steel handle, acting as the extreme effort. This massive distance from the nut creates an overwhelmingly powerful effort arm. It generates a turning moment strong enough to snap rusted metal." },
                    { q: "A pair of fire tongs is a lever of Class:", o: ["I", "II", "III", "IV"], a: 2, e: "You squeeze the middle (effort) to pick up a coal (load) at the end, pivoting at the joined back (fulcrum).", n: "Heavy iron fire tongs are deliberately engineered as Class III levers to prioritize reach and delicate control over raw crushing power. The two iron arms are securely welded together at the rear, creating a stationary fulcrum. The user naturally squeezes the center of the iron shafts, applying their muscular effort awkwardly between the rear weld and the distant tips. The blazing coal (the load) is carefully gripped at the extreme far end. This ensures the user's hand remains safely distant from the burning heat." },
                    { q: "In a Class II lever, if Load Arm is 0.5m and Effort Arm is 1.5m, M.A. is:", o: ["0.33", "3", "1", "0.75"], a: 1, e: "M.A. = Effort Arm / Load Arm = 1.5 / 0.5 = 3.", n: "This specific Class II lever provides a perfect, textbook example of geometric force multiplication. The user's hands are positioned a massive 1.5 meters away from the front hinge, generating an incredibly long effort arm. Meanwhile, the heavy payload is trapped a mere 0.5 meters from that same hinge. By directly dividing the massive 1.5m effort arm by the tiny 0.5m load arm, the math yields a beautiful result. The machine boasts a robust Mechanical Advantage of 3, making a 300N load feel like 100N." },
                    { q: "If the V.R. of a machine is 3, what does it mean?", o: ["Load moves 3 times as fast as effort", "Effort moves 3 times as fast as load", "Efficiency is 300%", "M.A. is exactly 3"], a: 1, e: "You have to pull 3 meters of rope for every 1 meter the load goes up.", n: "A Velocity Ratio of 3 acts as a strict, geometric contract outlining the exact distance penalty required to use the machine. It guarantees that the user's hands must sweep through space exactly three times faster and three times further than the heavy load they are lifting. If the operator desires to hoist an engine block exactly 1 meter off the garage floor, they are mathematically forced to furiously pull 3 full meters of chain. Distance is strictly traded for lifting capability." },
                    { q: "The mechanical advantage of a machine is 4. If effort is 50N, load lifted is:", o: ["12.5 N", "50 N", "200 N", "20 N"], a: 2, e: "Load = M.A. × Effort = 4 × 50 = 200 N.", n: "This calculation powerfully demonstrates the true magic of utilizing high-advantage machinery. The operator is only capable of providing a relatively weak, biological push of 50 Newtons. However, the machine's brilliant internal geometry boasts a massive Mechanical Advantage multiplier of exactly 4. By multiplying the weak 50N effort by the robust multiplier of 4, the machine violently translates that input into a crushing 200 Newton output. It allows a single human to easily overpower a massive, stubborn obstacle." },
                    { q: "Which of the following is an example of a Class I lever where M.A. < 1?", o: ["Pliers", "Crowbar", "A pair of scissors", "A see-saw"], a: 2, e: "Scissors have long blades (load arm) and short handles (effort arm), so M.A. < 1 (speed multiplier).", n: "While many Class I levers are built to crush, a standard pair of paper scissors is deliberately engineered for rapid, slicing speed. The central screw acts as the fulcrum, perfectly separating the user's fingers from the paper. However, the finger loops (effort arm) are noticeably short, while the sweeping steel blades (load arm) are exceptionally long. This inverted geometry mathematically locks the Mechanical Advantage below 1. While it requires slightly harder squeezing, the long blades snap shut with blistering velocity to slice paper instantly." },
                    { q: "Which of the following is an example of a Class I lever where M.A. > 1?", o: ["Pliers", "Scissors", "Fire tongs", "Sugar tongs"], a: 0, e: "Pliers have short jaws (load arm) and long handles (effort arm), making them a force multiplier.", n: "A pair of heavy-duty mechanic's pliers is the aggressive, bone-crushing cousin of the paper scissor. The central rivet acts as the pivoting fulcrum. The handles where the mechanic violently squeezes are heavily elongated, creating a massive, overpowering effort arm. Conversely, the biting steel jaws are incredibly short, creating a tiny, stubborn load arm. This specific Class I geometry guarantees a Mechanical Advantage wildly exceeding 1. It seamlessly translates a standard human handshake into a force capable of snapping thick copper wire." },
                    { q: "Is a knife an example of a wedge?", o: ["Yes", "No", "Only if it is dull", "It is a pulley"], a: 0, e: "A wedge is basically two inclined planes put together to split objects.", n: "Despite its simplicity, a steel knife blade is a brutally effective application of simple machine physics. If you observe a blade closely from the spine down to the cutting edge, it forms a severe, tapering V-shape. This shape is fundamentally constructed by fusing two aggressive inclined planes back-to-back. When the chef pushes down, this double-ramp violently redirects the downward effort into a massive, lateral splitting force. It effortlessly forces the fibers of the food apart, acting as the perfect splitting wedge." },
                    { q: "A single fixed pulley is used to draw water from a well. If the bucket weighs 100N and friction is 20N, effort required is:", o: ["100 N", "80 N", "120 N", "200 N"], a: 2, e: "You must pull with enough force to lift the bucket AND overcome friction: 100 + 20 = 120 N.", n: "Hauling water from a deep well exposes the grim reality of un-oiled, high-friction machinery. The heavy wooden bucket inherently demands a solid 100 Newtons of upward tension simply to combat gravity. However, the rusted, screaming axle of the pulley adds a parasitic 20 Newtons of pure frictional resistance. To achieve any upward movement, the villager must aggressively pull with enough force to defeat both enemies simultaneously. They must supply a total, exhausting effort of 120 Newtons just to get the water." },
                    { q: "The efficiency of the pulley in the previous question is:", o: ["100%", "83.3%", "120%", "50%"], a: 1, e: "Eff = (Load / Effort) / V.R. = (100 / 120) / 1 = 0.833 or 83.3%.", n: "Calculating the efficiency of the rusted well pulley reveals exactly how much energy is being senselessly destroyed. The villager successfully lifted a 100 Newton payload (the load), but they were brutally taxed, forced to supply 120 Newtons of raw effort. By dividing the useful 100N output by the exhausting 120N input, the math exposes a harsh fraction. The system operates at a mediocre 0.833, meaning it is only 83.3% efficient. Nearly 17% of the villager's energy is entirely wasted heating up the rusted axle." },
                    { q: "In a block and tackle with 4 pulleys, what is the V.R. if you pull the rope UPWARDS?", o: ["3", "4", "5", "6"], a: 2, e: "If you pull upwards, that final strand also supports the load, so V.R. = n + 1 = 5.", n: "The direction you aggressively pull the final rope drastically alters the mathematical geometry of a pulley rig. If you position yourself under the rig and heave the final rope violently upward, you are actively assisting the lift. That specific final strand of rope you are holding now acts as an additional, active lifting support against the heavy bottom block. This effectively adds a bonus 'invisible' pulley to the math. A 4-wheel rig suddenly boasts a highly superior Velocity Ratio of 5." },
                    { q: "In a block and tackle with 4 pulleys, what is the V.R. if you pull the rope DOWNWARDS?", o: ["3", "4", "5", "6"], a: 1, e: "If you pull downwards, the final strand does not pull the block up, so V.R. = n = 4.", n: "Standard industrial lifting usually involves pulling the final rope comfortably downward, utilizing gravity and body weight. However, this downward pulling strand is merely routed over the top fixed block; it does absolutely nothing to pull upward on the heavy bottom cargo block. Because it does not directly support the lifting action, it is entirely excluded from the Velocity Ratio count. The V.R. remains strictly equal to the number of active upward strands, which perfectly matches the 4 physical wheels." },
                    { q: "A machine is considered 'reversible' if its efficiency is:", o: ["< 50%", "> 50%", "Exactly 100%", "0%"], a: 1, e: "If efficiency > 50%, the load will fall back down if you let go of the effort.", n: "The concept of machine reversibility heavily dictates industrial safety standards. If a machine boasts a high efficiency rating exceeding 50%, it implies that internal friction is delightfully low. However, this low friction is incredibly dangerous if the operator suddenly loses their grip on the handle. Because there is not enough internal resistance to fight gravity, the heavy load will instantly and violently back-drive the machine, crashing to the floor. Highly efficient lifting machines desperately require external safety brakes." },
                    { q: "The principle of an ideal machine is based on the law of conservation of:", o: ["Force", "Momentum", "Energy", "Power"], a: 2, e: "Work input equals work output, meaning no energy is lost.", n: "The purely theoretical 'ideal machine' is the ultimate embodiment of the law of conservation of energy. It represents a flawless mathematical fantasy where friction and heat dissipation have been completely eradicated from existence. Because absolutely zero energy is stolen by the environment, every single drop of Work Input flawlessly translates into Work Output. The energy ledger balances to absolute perfection. While impossible to build, this concept is vital for engineers setting theoretical benchmarks for real-world mechanical designs." },
                    { q: "In a wheel and axle, the V.R. is:", o: ["Radius of axle / Radius of wheel", "Radius of wheel / Radius of axle", "Wheel diameter × Axle diameter", "1"], a: 1, e: "Effort is usually applied to the larger wheel, so V.R. = R / r.", n: "The wheel and axle operates as an incredibly elegant, continuously spinning lever system. The user typically grips the massive outer rim of the large wheel, applying their effort over a massive rotational distance. This rotation aggressively twists the tiny inner central axle, which winds up the heavy load string. The Velocity Ratio is beautifully calculated by dividing the massive radius of the outer wheel (R) by the tiny radius of the inner axle (r). A huge wheel spinning a tiny axle generates massive torque." },
                    { q: "Can the V.R. of a specific machine change?", o: ["Yes, with friction", "Yes, with load", "No, it is constant", "Only in space"], a: 2, e: "V.R. depends solely on the physical geometry/dimensions of the machine.", n: "The Velocity Ratio is the unyielding, unbreakable genetic code of any mechanical device. It is hard-coded entirely into the physical diameters of the gears, the exact length of the crowbar, or the total count of the pulley wheels. It is completely blind, deaf, and immune to chaotic external variables like heavy loads, screaming friction, or a rusty chain. Unless a mechanic physically takes a blowtorch and alters the metal dimensions of the machine, the Velocity Ratio will remain stubbornly constant forever." },
                    { q: "Can the M.A. of a specific machine change?", o: ["Yes, with friction", "No, it is constant", "Only if geometry changes", "Never"], a: 0, e: "Yes, M.A. drops if friction increases, because you have to apply more effort.", n: "Unlike the rigid Velocity Ratio, Mechanical Advantage is a highly sensitive, volatile metric deeply influenced by the harsh real world. It judges the actual, physical effort a human must supply to overcome a load. If a pulley system is left out in the rain to aggressively rust, the internal friction will skyrocket. The operator will suddenly be forced to pull significantly harder just to move the identical box. Because the required effort spiked, the calculated Mechanical Advantage undeniably plummets. Friction ruins M.A." }
                ]
            }
        }
    };

    let currentLevel = 'easy';
    let currentChapter = 'ch1';
    let loggedInUser = localStorage.getItem('physicsQuizUser') || null;
    let userAnswers = {};
    let quizScores = {};

    function initApp() {
        if (!loggedInUser) {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
            return;
        }

        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);
        document.getElementById('welcome-text').innerText = `Welcome, ${displayName}`;

        const savedAnswers = localStorage.getItem(`physicsQuizAnswers_${loggedInUser}`);
        const savedScores = localStorage.getItem(`physicsQuizScores_${loggedInUser}`);

        userAnswers = savedAnswers ? JSON.parse(savedAnswers) : {
            easy: { ch1: {}, ch2: {}, ch3: {} },
            medium: { ch1: {}, ch2: {}, ch3: {} }
        };
        
        quizScores = savedScores ? JSON.parse(savedScores) : {
            easy: { ch1: null, ch2: null, ch3: null },
            medium: { ch1: null, ch2: null, ch3: null }
        };

        loadQuiz('ch1');
    }

    function saveState() {
        if(!loggedInUser) return;
        localStorage.setItem(`physicsQuizAnswers_${loggedInUser}`, JSON.stringify(userAnswers));
        localStorage.setItem(`physicsQuizScores_${loggedInUser}`, JSON.stringify(quizScores));
    }
    
    function clearAppData() {
        if (confirm("Are you sure you want to completely clear the local data? This will fix caching issues but will erase all scores and answers for all accounts on this device.")) {
            localStorage.clear();
            alert("Local storage wiped successfully. Reloading the app...");
            location.reload(true);
        }
    }

    function handleLogin() {
        const userField = document.getElementById('username').value.trim().toLowerCase();
        const passField = document.getElementById('password').value.trim();

        if (validAccounts[userField] && validAccounts[userField] === passField) {
            loggedInUser = userField;
            localStorage.setItem('physicsQuizUser', loggedInUser);
            document.getElementById('login-error').style.display = 'none';
            initApp();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') handleLogin();
    }

    function handleLogout() {
        // Clear local storage key and current user variable
        localStorage.removeItem('physicsQuizUser');
        loggedInUser = null;
        userAnswers = {};
        quizScores = {};

        // Hide app, show login overlay
        document.getElementById('app-content').style.display = 'none';
        document.getElementById('login-overlay').style.display = 'flex';

        // Clear the input fields for the next user
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('login-error').style.display = 'none';
    }

    function setLevel(level) {
        currentLevel = level;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${level}`).classList.add('active');
        loadQuiz(currentChapter);
    }

    function updateTabScores() {
        const c1 = quizScores[currentLevel]['ch1'];
        const c2 = quizScores[currentLevel]['ch2'];
        const c3 = quizScores[currentLevel]['ch3'];
        
        document.getElementById('badge-ch1').innerHTML = c1 !== null ? `<span class="score-badge">${c1}/40</span>` : '';
        document.getElementById('badge-ch2').innerHTML = c2 !== null ? `<span class="score-badge">${c2}/40</span>` : '';
        document.getElementById('badge-ch3').innerHTML = c3 !== null ? `<span class="score-badge">${c3}/40</span>` : '';
    }

    function loadQuiz(chapterId) {
        currentChapter = chapterId;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${chapterId}`).classList.add('active');
        
        updateTabScores();

        document.getElementById('quiz-view').classList.add('active');
        document.getElementById('report-view').classList.remove('active');

        const activeData = quizData[currentLevel][chapterId];
        document.getElementById('quiz-title').innerText = activeData.title;

        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        activeData.questions.forEach((qObj, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-block';
            
            const answeredOption = userAnswers[currentLevel][chapterId][index];
            const isAnswered = answeredOption !== undefined;
            
            let optionsHTML = '';
            qObj.o.forEach((opt, optIndex) => {
                const isChecked = isAnswered && answeredOption === optIndex;
                let optionClasses = 'option-label ';
                
                if (isAnswered) {
                    optionClasses += 'locked ';
                    if (optIndex === qObj.a) optionClasses += 'correct-choice ';
                    else if (isChecked) optionClasses += 'incorrect-choice ';
                }

                optionsHTML += `
                    <label class="${optionClasses}" id="label-${currentLevel}-${chapterId}-${index}-${optIndex}">
                        <input type="radio" name="q-${currentLevel}-${chapterId}-${index}" value="${optIndex}" 
                        ${isChecked ? 'checked' : ''}
                        ${isAnswered ? 'disabled' : ''}
                        onchange="selectAnswer('${chapterId}', ${index}, ${optIndex})">
                        ${opt}
                    </label>
                `;
            });

            let feedbackHTML = '';
            if (isAnswered) {
                const isCorrect = answeredOption === qObj.a;
                feedbackHTML = `
                    <div id="feedback-${currentLevel}-${chapterId}-${index}" class="feedback-container ${isCorrect ? 'correct' : 'incorrect'}" style="display:block;">
                        <div class="feedback-header" style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'};">
                            ${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}
                        </div>
                        <div class="feedback-panels">
                            <div class="panel">
                                <h4>Logic</h4>
                                <p>${qObj.e}</p>
                            </div>
                            <div class="panel">
                                <h4>Note</h4>
                                <p>${qObj.n}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                feedbackHTML = `<div id="feedback-${currentLevel}-${chapterId}-${index}" class="feedback-container"></div>`;
            }

            qDiv.innerHTML = `
                <div class="question-text">${index + 1}. ${qObj.q}</div>
                <div class="options-grid">${optionsHTML}</div>
                ${feedbackHTML}
            `;
            container.appendChild(qDiv);
        });

        const submitContainer = document.getElementById('submit-container');
        if (quizScores[currentLevel][chapterId] !== null) {
            submitContainer.innerHTML = `<button class="btn btn-primary" onclick="showReport()">📊 View Report (Score: ${quizScores[currentLevel][chapterId]}/40)</button>`;
        } else {
            submitContainer.innerHTML = `<button class="btn btn-primary" onclick="submitQuiz()">Submit & Get Final Report</button>`;
        }
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.selectAnswer = function(chapterId, qIndex, optIndex) {
        if (userAnswers[currentLevel][chapterId][qIndex] !== undefined) return;

        userAnswers[currentLevel][chapterId][qIndex] = optIndex;
        saveState(); 
        
        const qObj = quizData[currentLevel][chapterId].questions[qIndex];
        const isCorrect = optIndex === qObj.a;
        
        for(let i=0; i<4; i++) {
            const label = document.getElementById(`label-${currentLevel}-${chapterId}-${qIndex}-${i}`);
            const input = label.querySelector('input');
            
            if (label && input) {
                label.classList.add('locked');
                input.disabled = true; 
                
                if (i === qObj.a) label.classList.add('correct-choice'); 
                else if (i === optIndex) label.classList.add('incorrect-choice'); 
            }
        }
        
        const feedbackBox = document.getElementById(`feedback-${currentLevel}-${chapterId}-${qIndex}`);
        feedbackBox.className = `feedback-container ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackBox.innerHTML = `
            <div class="feedback-header" style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'};">
                ${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}
            </div>
            <div class="feedback-panels">
                <div class="panel">
                    <h4>Logic</h4>
                    <p>${qObj.e}</p>
                </div>
                <div class="panel">
                    <h4>Note</h4>
                    <p>${qObj.n}</p>
                </div>
            </div>
        `;
        feedbackBox.style.display = 'block';
    }

    window.submitQuiz = function() {
        const activeData = quizData[currentLevel][currentChapter];
        const totalQ = activeData.questions.length;
        const answeredQ = Object.keys(userAnswers[currentLevel][currentChapter]).length;

        if (answeredQ < totalQ) {
            const confirmSubmit = confirm(`You have only answered ${answeredQ} out of ${totalQ} questions. Unanswered questions will be marked wrong. Do you want to submit anyway?`);
            if(!confirmSubmit) return;
        }

        let score = 0;
        activeData.questions.forEach((qObj, index) => {
            if (userAnswers[currentLevel][currentChapter][index] === qObj.a) score++;
        });
        
        quizScores[currentLevel][currentChapter] = score;
        saveState(); 
        
        updateTabScores();
        showReport();
    }

    window.showReport = function() {
        const data = quizData[currentLevel][currentChapter];
        const score = quizScores[currentLevel][currentChapter];

        document.getElementById('quiz-view').classList.remove('active');
        document.getElementById('report-view').classList.add('active');
        
        const reportContainer = document.getElementById('printable-report');
        let reviewHTML = '';

        data.questions.forEach((qObj, index) => {
            const userAns = userAnswers[currentLevel][currentChapter][index];
            const isAnswered = userAns !== undefined;
            const isCorrect = isAnswered && (userAns === qObj.a);

            const badgeClass = isCorrect ? 'badge-correct' : 'badge-incorrect';
            const badgeText = isCorrect ? '✓ Correct' : '✗ Incorrect';
            const userAnswerText = isAnswered ? qObj.o[userAns] : 'Not Answered';

            reviewHTML += `
                <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                    <span class="review-badge ${badgeClass}">${badgeText}</span>
                    <div class="question-text">${index + 1}. ${qObj.q}</div>
                    
                    <p style="margin-bottom: 5px;"><strong>Your Answer:</strong> 
                        <span style="color: ${isCorrect ? 'var(--success)' : 'var(--danger)'}">${userAnswerText}</span>
                    </p>
                    
                    ${!isCorrect ? `<p style="margin-bottom: 15px;"><strong>Correct Answer:</strong> <span style="color: var(--success); font-weight: bold;">${qObj.o[qObj.a]}</span></p>` : '<br>'}
                    
                    <div class="feedback-panels" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div style="background:#fff; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">
                            <strong style="color: var(--primary-dark);">Logic:</strong><br>
                            <span style="font-size: 0.95rem;">${qObj.e}</span>
                        </div>
                        <div style="background:#fff; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">
                            <strong style="color: var(--primary-dark);">Note:</strong><br>
                            <span style="font-size: 0.95rem;">${qObj.n}</span>
                        </div>
                    </div>
                </div>
            `;
        });

        const percentage = ((score / data.questions.length) * 100).toFixed(0);
        const dateString = new Date().toLocaleDateString();
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        reportContainer.innerHTML = `
            <div class="report-header">
                <h2>Performance Report</h2>
                <h3 style="color: var(--text-light);">${data.title}</h3>
                <p>Student: <strong>${displayName}</strong> | Generated on: ${dateString}</p>
            </div>
            
            <div class="score-box">
                <p>TOTAL MARKS OBTAINED</p>
                <h2>${score} / ${data.questions.length}</h2>
                <p>Accuracy: ${percentage}%</p>
            </div>

            <h3 style="margin-bottom: 20px; text-align: center; color: var(--primary-dark);">Detailed Review</h3>
            ${reviewHTML}
        `;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.backToQuizzes = function() {
        loadQuiz(currentChapter);
    }
    
    window.retakeQuiz = function() {
        const confirmRetake = confirm(`Are you sure you want to erase your score and retake this quiz?`);
        if(!confirmRetake) return;
        
        userAnswers[currentLevel][currentChapter] = {};
        quizScores[currentLevel][currentChapter] = null;
        saveState(); 
        
        loadQuiz(currentChapter);
    }

    window.exportPDF = function() {
        const element = document.getElementById('printable-report');
        const filename = `Physics_Report_${loggedInUser}_${currentLevel}_${currentChapter}.pdf`;
        
        const opt = {
            margin:       [15, 15, 15, 15],
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };
        html2pdf().set(opt).from(element).save();
    }

    window.exportAllScores = function() {
        const tempDiv = document.createElement('div');
        tempDiv.style.padding = '30px';
        tempDiv.style.fontFamily = 'sans-serif';
        tempDiv.style.color = '#0f172a';
        
        const getScoreText = (val) => {
            if (val !== null) {
                const percentage = ((val / 40) * 100).toFixed(0);
                return `<strong style="color: #10b981;">Marks: ${val} / 40 &nbsp;&nbsp;|&nbsp;&nbsp; Percentage: ${percentage}%</strong>`;
            }
            return '<span style="color: #64748b;">Not Attempted</span>';
        };
        
        const displayName = loggedInUser.charAt(0).toUpperCase() + loggedInUser.slice(1);

        tempDiv.innerHTML = `
            <div style="text-align: center; margin-bottom: 40px;">
                <h1 style="color: #2563eb; font-size: 28px;">Physics Learning Quiz - Master Score Report</h1>
                <p style="font-size: 16px; color: #64748b;">Student: <strong>${displayName}</strong> | ICSE Grade 10 | Generated on: ${new Date().toLocaleDateString()}</p>
            </div>
            
            <div style="margin-bottom: 30px;">
                <h2 style="background: #10b981; color: white; padding: 10px; border-radius: 6px;">Easy Level Scores</h2>
                <ul style="list-style: none; padding: 0; font-size: 18px; line-height: 2;">
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 1: Force</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.easy.ch1)}</span></li>
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 2: Work & Energy</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.easy.ch2)}</span></li>
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 3: Machines</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.easy.ch3)}</span></li>
                </ul>
            </div>

            <div style="margin-bottom: 30px;">
                <h2 style="background: #f59e0b; color: white; padding: 10px; border-radius: 6px;">Medium Level Scores</h2>
                <ul style="list-style: none; padding: 0; font-size: 18px; line-height: 2;">
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 1: Force</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.medium.ch1)}</span></li>
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 2: Work & Energy</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.medium.ch2)}</span></li>
                    <li style="border-bottom: 1px solid #e2e8f0; padding: 10px 0;"><strong>Chapter 3: Machines</strong> <br> <span style="display: block; margin-top: 5px;">${getScoreText(quizScores.medium.ch3)}</span></li>
                </ul>
            </div>
        `;

        const opt = {
            margin:       15,
            filename:     `Physics_Master_Score_Report_${loggedInUser}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(tempDiv).save();
    }

    window.onload = initApp;
</script>

</body>
</html>
