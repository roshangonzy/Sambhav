                    { q: "What is a block and tackle?", o: ["A type of lever", "A combination of pulleys", "A type of wedge", "An inclined plane"], a: 1, e: "It consists of fixed and movable blocks of pulleys used together.", n: "A block and tackle is an incredibly robust lifting system born from marrying multiple pulleys together. It features a stationary 'block' securely bolted to the ceiling and a free-floating 'block' securely hooked to the massive load. A single, continuous length of heavy-duty rope threads back and forth between the wheels of both blocks. By utilizing multiple strands to support the load, it compounds the force multiplication massively. This ingenious system allows a single mechanic to manually hoist a heavy car engine." },
                    { q: "In a block and tackle system, V.R. is equal to:", o: ["Total number of pulleys", "Half the pulleys", "Number of fixed pulleys", "One"], a: 0, e: "The velocity ratio is exactly equal to the total number of rope segments supporting the movable block (which equals total pulleys).", n: "Calculating the Velocity Ratio of a standard block and tackle is delightfully simple: you merely count the moving wheels. Specifically, the V.R. flawlessly mirrors the total number of individual rope segments actively pulling upward on the bottom, movable block. In a standard setup, this number perfectly matches the total count of individual pulley wheels integrated into the entire system. If the rig possesses 5 wheels, you must pull 5 meters of rope to lift the box 1 meter. It dictates the distance penalty." },
                    { q: "Can a machine be used to multiply BOTH force and speed at the same time?", o: ["Yes", "No", "Only in space", "Depends on size"], a: 1, e: "No, you can only have a force multiplier OR a speed multiplier, not both simultaneously.", n: "The unbreakable law of conservation of energy acts as the ultimate cosmic referee, forbidding a machine from multiplying both variables simultaneously. If a machine magically multiplied both force and speed, it would be generating an output of work vastly larger than the human input, which is impossible. You must choose your mechanical priority. You can sacrifice speed to gain massive force, or you can sacrifice force to gain blistering speed. You can never cheat the universal energy ledger." },
                    { q: "If Mechanical Advantage > 1, the machine acts as a:", o: ["Force multiplier", "Speed multiplier", "Direction changer", "Energy creator"], a: 0, e: "It allows you to lift a heavy load with a smaller effort.", n: "When the mathematical ratio of Load divided by Effort yields a result greater than 1, it signifies a mechanical victory. It proves that the output force crushing the load is significantly larger than the fragile input effort provided by the user. The machine is actively taking a weak push and amplifying it into a massive shove. Crowbars, car jacks, and movable pulleys proudly fall into this coveted category. They empower humans to move mountains." },
                    { q: "If Mechanical Advantage < 1, the machine acts as a:", o: ["Force multiplier", "Speed multiplier", "Direction changer", "Useless machine"], a: 1, e: "You apply more effort, but the load moves a greater distance/faster.", n: "A Mechanical Advantage dipping below 1 initially appears to be a disastrous engineering failure, meaning you are pushing harder than the load actually weighs. However, this intentional sacrifice of brute strength purchases a massive upgrade in velocity and reach. While the effort is intense, the load end sweeps through a massive distance in a fraction of a second. This is the exact principle powering a golf club, a tennis racket, or a baker's sweeping broom. It is the architecture of speed." },
                    { q: "Which class of lever ALWAYS has a Mechanical Advantage greater than 1?", o: ["Class I", "Class II", "Class III", "None"], a: 1, e: "In Class II, the effort arm is always longer than the load arm.", n: "The Class II lever is geometrically locked into being the ultimate force multiplier. Because the heavy load is permanently trapped between the hinge and the handle, the user's hand is guaranteed to be the furthest point from the pivot. This inescapable structural reality ensures the effort arm is always, without exception, longer than the load arm. Consequently, the math permanently forces the Mechanical Advantage to sit comfortably above 1. It will always make lifting feel lighter." },
                    { q: "Which class of lever ALWAYS has a Mechanical Advantage less than 1?", o: ["Class I", "Class II", "Class III", "None"], a: 2, e: "In Class III, the effort arm is always shorter than the load arm.", n: "The Class III lever is structurally condemned to demand excess force, permanently locking its Mechanical Advantage below 1. Because the user's pushing effort is awkwardly squeezed between the rear pivot and the distant load, the effort arm is guaranteed to be aggressively stubby. This short arm means the user must apply a punishingly strong force just to move a relatively light load. However, the distant load sweeps through a massive arc, granting the user a massive speed boost. It is the design of athletes and sweepers." },
                    { q: "Which class of lever can have a Mechanical Advantage greater, less, or equal to 1?", o: ["Class I", "Class II", "Class III", "None"], a: 0, e: "Because the fulcrum is in the middle, the arms can be of any relative length.", n: "The Class I lever is the chaotic wildcard of the mechanical world, offering total design flexibility. Because the fulcrum sits freely between the effort and the load, engineers can slide it wherever they please. Shoving the fulcrum near the load creates a massive force multiplier (M.A. > 1). Sliding it near the hands creates a rapid speed multiplier (M.A. < 1). Placing it dead center creates a flawless, neutral balance (M.A. = 1). Its versatility is unmatched." },
                    { q: "A machine does NOT:", o: ["Multiply force", "Multiply speed", "Change direction", "Create energy"], a: 3, e: "The law of conservation of energy states that machines cannot create energy.", n: "While machines can brilliantly manipulate force, distance, and direction, they remain firmly chained by the laws of thermodynamics. It is physically impossible for any collection of gears or levers to magically spontaneously generate fresh energy from nothing. Every single Joule of output work must be explicitly paid for by a Joule of input effort. In fact, due to the inescapable presence of friction, machines will always silently destroy a tiny fraction of your input energy. They are manipulators, not creators." },
                    { q: "The unit of Mechanical Advantage is:", o: ["Newton", "Joule", "Watt", "No unit"], a: 3, e: "It is a ratio of two forces (Load/Effort), so the units cancel out.", n: "Mechanical Advantage is calculated by directly dividing the output force (Load) by the input force (Effort). Because both of these variables are measured in Newtons, the mathematical division causes the units to perfectly cancel each other out. The final result is left as a pure, naked numerical value. It simply acts as a multiplier indicating 'how many times' easier the task has become. It doesn't need a unit because it represents a clean comparative scale." },
                    { q: "The unit of Velocity Ratio is:", o: ["m/s", "meter", "Joule", "No unit"], a: 3, e: "It is a ratio of two distances, so it has no unit.", n: "Velocity Ratio evaluates the geometric layout of a machine by dividing the distance the effort moves by the distance the load moves. Since you are dividing meters by meters, the units annihilate each other during the calculation. This leaves the Velocity Ratio as a completely dimensionless, naked number. It strictly represents a proportional relationship regarding distance sacrifice. Like its cousin Mechanical Advantage, it exists solely as a pure multiplier." },
                    { q: "A wheelbarrow is an example of a lever of:", o: ["Class I", "Class II", "Class III", "Not a lever"], a: 1, e: "The load (dirt) is between the fulcrum (wheel) and the effort (handles).", n: "The classic wheelbarrow is a masterclass in Class II lever design. The single front tire firmly acts as the rotating fulcrum against the ground. The heavy payload of dirt or bricks is dumped directly into the central bucket, representing the load. The laborer firmly grips the elongated rear handles to lift, establishing the effort at the maximum possible distance. This perfectly traps the load in the middle, guaranteeing a massive force multiplication to easily transport heavy debris." },
                    { q: "A human forearm lifting a weight is a lever of:", o: ["Class I", "Class II", "Class III", "Not a lever"], a: 2, e: "The elbow is the fulcrum, the bicep applies effort in the middle, lifting the load in the hand.", n: "Human biology heavily relies on Class III levers to guarantee rapid, sweeping limb movements. When you curl a dumbbell, your stationary elbow acts as the strong rear fulcrum. Your massive bicep muscle attaches to the forearm bones slightly ahead of the elbow, applying intense lifting effort extremely close to the pivot. The dumbbell rests far away in your hand, meaning your bicep must pull incredibly hard to lift it. However, this setup allows your hand to move fast and far." },
                    { q: "A see-saw is a lever of:", o: ["Class I", "Class II", "Class III", "Not a lever"], a: 0, e: "The fulcrum is directly in the middle between the two people.", n: "The playground see-saw is the most universally recognized embodiment of a Class I lever. A central, stationary hinge completely supports the long wooden plank, acting as the undeniable fulcrum. One child sitting on the left acts as the driving effort, pushing down, while the child on the right acts as the resisting load being lifted. Because the fulcrum cleanly separates the pushing child from the lifting child, it perfectly fits the Class I definition. It relies entirely on balancing opposing moments." },
                    { q: "Why do we use Class III levers if they require more effort?", o: ["To gain speed", "To multiply force", "To change direction", "They look nice"], a: 0, e: "They act as speed multipliers (e.g., swinging a bat or fishing rod).", n: "It seems counterintuitive to intentionally design a machine that demands you push harder than the load actually weighs. However, Class III levers willingly sacrifice brute strength to purchase a massive upgrade in operational speed and reach. A tiny, aggressive twitch of the wrist near the pivot violently launches the distant end of a baseball bat through a massive arc in milliseconds. This sweeping, rapid strike is impossible to achieve with force-multiplying levers. It is the physics of sports." },
                    { q: "In a machine, Work Input =", o: ["Load × Load distance", "Effort × Effort distance", "Load / Effort", "Effort / Load"], a: 1, e: "Work input is the work you do: your Effort force multiplied by the distance you move it.", n: "Work Input represents the total energetic invoice you must personally pay to operate a machine. It is aggressively calculated by taking the raw physical force you exert (Effort) and multiplying it by the total distance you had to sweat and push it (Effort Distance). This represents the absolute ceiling of available energy entering the mechanical system. Because of the tyrannical laws of physics, the machine can never output more work than this initial human investment. It is your total payment." },
                    { q: "In a machine, Work Output =", o: ["Load × Load distance", "Effort × Effort distance", "Load / Effort", "Efficiency"], a: 0, e: "Work output is what the machine achieves: moving the Load force over a distance.", n: "Work Output represents the final, practical achievement the machine was hired to complete. It is mathematically determined by multiplying the massive weight of the object being fought (Load) by the physical height or distance it was successfully shifted (Load Distance). This value reveals the true, useful mechanical energy that successfully survived the journey through the machine. Due to the inevitable parasitic drain of friction, this output value will depressingly always fall short of your initial work input." },
                    { q: "Which of the following reduces the efficiency of a machine?", o: ["High speed", "Friction", "Large load", "Gravity"], a: 1, e: "Friction creates heat, wasting some of the input energy.", n: "Friction acts as the silent, inescapable thief inside every practical mechanical system ever built. The moment gears mesh or ropes slide over metal, this microscopic resistance begins tearing away at your invested energy. Instead of funneling your effort into lifting the load, friction viciously converts that precious energy into useless thermal heat. This dissipated heat bleeds off into the atmosphere, permanently reducing the machine's final work output. It is the sole reason why a 100% efficient machine is a fantasy." },
                    { q: "An inclined plane acts as a:", o: ["Force multiplier", "Speed multiplier", "Class III lever", "Pulley"], a: 0, e: "It takes less force to push an object up a ramp than to lift it straight up.", n: "An inclined plane, commonly known as a ramp, is a beautifully simplistic static machine that violently cheats gravity. Attempting to vertically deadlift a heavy crate into a truck bed requires a brutal, intense burst of pure effort. By sliding the crate up a gentle slope, the required pushing force is drastically diluted and reduced to a manageable level. You successfully multiply your force, allowing a single person to load a massive payload. The required sacrifice is simply walking a significantly longer distance." },
                    { q: "The mechanical advantage of an inclined plane is always:", o: ["Greater than 1", "Less than 1", "Equal to 1", "Zero"], a: 0, e: "The length of the slope is always greater than the vertical height.", n: "The physics defining an inclined plane dictate that its Mechanical Advantage must perpetually remain greater than 1. This is because the M.A. is calculated by dividing the long, sweeping length of the ramp by its sheer vertical height. According to basic geometry, the hypotenuse (the ramp) is mathematically guaranteed to be longer than the vertical leg (the height). This ensures the division always results in a positive multiplication factor. It guarantees pushing up a ramp is always easier than vertical lifting." },
                    { q: "A crowbar is usually used as a lever of:", o: ["Class I", "Class II", "Class III", "Class IV"], a: 0, e: "You wedge it under a rock (load), pivot on a small stone (fulcrum), and push down the long end (effort).", n: "When a worker employs a heavy steel crowbar to dislodge a stubborn boulder, they instinctively build a Class I lever. They aggressively wedge the short tip under the boulder (load) and place a smaller, solid rock nearby to act as a pivoting hinge (fulcrum). They then throw their body weight down onto the extreme far end of the bar (effort). Because the fulcrum is trapped between the rock and their hands, it perfectly mimics a see-saw. This grants immense, rock-shattering force multiplication." }
                ]
            }
        },
        medium: {
            ch1: {
                title: "Chapter 1: Force (Medium Level)",
                questions: [
                    { q: "If a force of 10N is applied at a distance of 0.5m from a pivot, the moment is:", o: ["5 N m", "20 N m", "10.5 N m", "0.05 N m"], a: 0, e: "Moment = F × d = 10 × 0.5 = 5 N m.", n: "The calculation of torque is a strict, linear multiplication of the applied force and its perpendicular distance to the hinge. By inputting 10 Newtons of pushing power at a displacement of exactly half a meter, the math yields a clean 5 N m turning effect. This simple moment dictates exactly how aggressively the object will begin to spin on its axis. If you moved your hand inward to 0.25 meters, you would instantly halve this turning effect. Geometry dictates power." },
                    { q: "For a body to be in complete equilibrium, it needs:", o: ["Only translational equilibrium", "Only rotational equilibrium", "Both translational and rotational", "Neither"], a: 2, e: "Net force must be zero AND net moment must be zero.", n: "True, complete mechanical equilibrium demands a flawless, dual-layered cessation of all disruptive forces. First, the algebraic sum of all linear pushes and pulls must crash to absolute zero to prevent straight-line translation. Second, the chaotic sum of all clockwise and anticlockwise twisting moments must also perfectly neutralize to prevent spinning. If even a microscopic unbalanced force or moment remains, the object will physically accelerate or rotate. It represents perfect, unshakable physical stillness." },
                    { q: "A uniform metre scale balances at the 40 cm mark when a weight of 20 gf is suspended at the 10 cm mark. What is the weight of the scale?", o: ["20 gf", "40 gf", "60 gf", "80 gf"], a: 2, e: "Anticlockwise moment = 20 × (40-10) = 600. Clockwise moment = W × (50-40) = 10W. So, 10W = 600 -> W = 60 gf.", n: "This classic laboratory problem beautifully tests the principle of moments in a real-world scenario. The suspended 20 gf weight violently pulls down at a 30 cm distance from the pivot, creating a massive 600 unit anticlockwise torque. To stop the ruler from flipping, the ruler's own invisible center of gravity (located at the 50 cm mark) must pull down on the other side. Since this center is only 10 cm away from the pivot, it requires a hefty 60 gf weight to equal that 600 unit twist. Math reveals the hidden weight." },
                    { q: "If the radius of a circular path is halved and speed remains constant, centripetal force becomes:", o: ["Half", "Double", "Four times", "One fourth"], a: 1, e: "F = mv^2 / r. If r is halved, the denominator is smaller, making Force double.", n: "The physics equation dictating centripetal force (F = mv²/r) reveals a deeply inverse relationship with the circle's radius. When you violently tighten a turn by slicing the radius exactly in half, you are dividing by a much smaller number. This mathematical crunch instantly forces the required inward pull to aggressively double in intensity to maintain the same speed. This is why taking a sharp corner in a speeding car feels violently aggressive on your body. The tighter the curve, the harsher the physics." },
                    { q: "Work done by centripetal force is zero because the angle between force and displacement is:", o: ["0 degrees", "45 degrees", "90 degrees", "180 degrees"], a: 2, e: "Force is towards the center, displacement is tangential. Cos(90) = 0.", n: "The strict definition of mechanical work demands that a force must push an object somewhat in the direction it is actually moving. Centripetal force acts as a stubborn leash, pulling strictly inward toward the circle's absolute center. Meanwhile, the object is desperately trying to fly forward along the tangent, creating a perfect 90-degree intersection between force and travel. Because the cosine of 90 degrees is mathematically zero, the entire work equation collapses. The inward leash does zero forward work." },
                    { q: "Two forces of 10N each act in opposite directions at ends of a rod 2m long. The moment of couple is:", o: ["10 N m", "20 N m", "0 N m", "40 N m"], a: 1, e: "Moment of couple = Either Force × perpendicular distance between them = 10 × 2 = 20 N m.", n: "A couple is a unique mechanical phenomenon that specializes in generating pure, untethered rotation. To calculate its total twisting power, you do not add the forces together, but simply multiply one of the 10N forces by the total 2-meter gap separating them. This brilliant shortcut instantly yields a robust 20 N m rotational torque. Because the forces cancel each other's linear push, this entire 20 N m is dumped purely into violently spinning the rod. It is efficient rotational math." },
                    { q: "A body is moving in a circular path with constant speed. Its acceleration is:", o: ["Zero", "Directed towards centre", "Directed away from centre", "Directed tangentially"], a: 1, e: "Uniform circular motion has centripetal acceleration acting towards the center.", n: "Even when an object orbits with a perfectly locked, unchanging speedometer reading, it remains trapped in a state of perpetual acceleration. Because acceleration tracks changes in velocity—which includes directional heading—the constant curving of the path triggers the math. This unavoidable acceleration must point exactly in the direction of the force causing it. Therefore, this hidden acceleration vector permanently stabs inward, aimed directly at the circle's core. It is the silent driver of the curve." },
                    { q: "Can a body have a constant speed but a changing velocity?", o: ["No", "Yes, in straight line", "Yes, in circular motion", "Only in space"], a: 2, e: "In circular motion, speed is constant but direction changes, so velocity changes.", n: "This question highlights the critical, often misunderstood distinction between simple scalar speed and complex vector velocity. An object spinning on a turntable might maintain a flawless, unwavering speed of 5 meters per second indefinitely. However, because its physical compass heading is wildly rotating 360 degrees, its vector velocity is in absolute chaos. Therefore, uniform circular motion serves as the ultimate proof that speed can remain locked while velocity constantly shifts. Direction changes everything." },
                    { q: "Which force is the reaction to centripetal force?", o: ["Centrifugal force", "Gravitational force", "Frictional force", "Tension"], a: 0, e: "According to Newton's 3rd law, centrifugal force acts outwards as a reaction.", n: "Newton's legendary Third Law dictates that every single force in the universe must possess an equal, aggressively opposing twin. If a string applies an inward centripetal force to violently yank a spinning stone into a curve, a reaction must occur. The stone, fighting to maintain a straight line due to inertia, violently yanks back outward against the string. This specific outward reactive tension is frequently labeled as the centrifugal reaction force. It is the stone fighting the leash." },
                    { q: "Where does the centre of gravity of a solid cylinder lie?", o: ["Base", "Midpoint of its geometric axis", "Surface", "Anywhere"], a: 1, e: "For a uniform solid cylinder, it balances perfectly at the middle of its central axis.", n: "A properly manufactured, uniform solid cylinder boasts perfect symmetry regarding its heavy mass distribution. Gravity pulls uniformly down on its flat top, its curved sides, and its heavy bottom. The mathematical average of all these tiny gravitational pulls naturally coalesces dead in the center of its internal core. Specifically, this point sits exactly halfway up its central vertical axis. A pin perfectly inserted at this hidden point would allow the cylinder to balance effortlessly in any orientation." },
                    { q: "The C.G. of a triangular lamina is at its:", o: ["Incentre", "Orthocentre", "Centroid", "Circumcentre"], a: 2, e: "The centroid is the point where the three medians of the triangle intersect.", n: "A triangular lamina is a flat, two-dimensional sheet of metal or plastic cut into a rigid, three-sided shape. To locate its invisible balancing point, engineers draw straight medians from each sharp corner to the exact center of the opposing flat wall. Astonishingly, all three of these drawn medians will perfectly collide at one single, undeniable coordinate. This intersection is mathematically christened the centroid. If you balance the triangle on a needle exactly at this centroid, it will sit perfectly flat." },
                    { q: "To increase the turning effect of a force, you should:", o: ["Decrease the distance", "Increase the perpendicular distance", "Decrease the force", "Push near the pivot"], a: 1, e: "Moment is proportional to distance. A larger distance gives a larger turning effect.", n: "Torque is a brutal mathematical game of multiplying your pushing force by your geometric leverage. If you are physically maxed out and cannot push a wrench any harder, your only option is to manipulate the geometry. By dramatically sliding your hand further down the handle, you artificially inflate the perpendicular distance variable. This instantly triggers a massive surge in the final turning effect without demanding an extra ounce of muscle. It is how human intelligence overcomes biological limits." },
                    { q: "If an anticlockwise moment is 50 Nm and a clockwise moment is 30 Nm, the resultant moment is:", o: ["80 Nm clockwise", "20 Nm anticlockwise", "20 Nm clockwise", "Zero"], a: 1, e: "Net moment = 50 (anti) - 30 (clock) = 20 Nm in the anticlockwise direction.", n: "When multiple torques assault a rigid body simultaneously, they engage in a violent mathematical tug-of-war. The robust 50 Nm twist aggressively attempts to spin the object left (positive), while the weaker 30 Nm twist tries to spin it right (negative). Because they are directly opposing each other on the same axis, they partially cancel out in a simple subtraction battle. The dominant anticlockwise force wins the struggle, leaving a leftover, uncancelled 20 Nm twist. This residual torque dictates the final spin." },
                    { q: "1 kgf is roughly equal to:", o: ["1 N", "9.8 N", "980 N", "10 N"], a: 1, e: "1 kgf is the force of gravity on 1 kg. F = mg = 1 × 9.8 = 9.8 N.", n: "The kilogram-force (kgf) is an incredibly intuitive, albeit slightly archaic, method for visualizing raw mechanical thrust. It is strictly defined as the exact amount of downward pull the Earth exerts on a one-kilogram bag of sugar. By utilizing Newton's famous gravity equation (W=mg), we multiply that 1 kg mass by Earth's 9.8 m/s² acceleration. This mathematically proves that holding up a 1 kg bag requires precisely 9.8 Newtons of upward effort. It effectively translates abstract Newtons into relatable, heavy reality." },
                    { q: "Which requires less force: turning a nut with a 10cm spanner or a 20cm spanner?", o: ["10cm spanner", "20cm spanner", "Both same", "Depends on the nut"], a: 1, e: "The 20cm spanner has a longer distance, meaning it requires less force to produce the same moment.", n: "A rusted, seized bolt demands a very specific, massive threshold of torque before it agrees to snap loose. A short 10cm wrench offers miserable geometric leverage, forcing the mechanic's arm to supply a massive, painful amount of raw force. Swapping to a 20cm wrench instantly doubles the available perpendicular distance in the torque equation. Because the distance is doubled, the required biological force is mercifully sliced cleanly in half. It is a perfect demonstration of trading distance for ease." },
                    { q: "A boy of 40 kg sits 1.5 m from the fulcrum of a seesaw. Where must a 30 kg boy sit to balance him?", o: ["1 m", "1.5 m", "2 m", "2.5 m"], a: 2, e: "40 × 1.5 = 30 × d. 60 = 30d, so d = 2 m.", n: "This see-saw scenario demands strict adherence to the unforgiving principle of moments. The heavier 40 kg boy sits fairly close, generating a robust 60 unit twisting moment (40 x 1.5) that attempts to slam his side down. To prevent a crash, the lighter 30 kg boy must generate an identical 60 unit moment on the opposing side. Because he lacks physical mass, he must compensate by sliding significantly further backward on the plank. Pushing back to the 2-meter mark perfectly balances the mathematical scales." },
                    { q: "In a merry-go-round, a person leans inward. Which force is providing this inward pull?", o: ["Centrifugal", "Centripetal", "Gravitational", "Magnetic"], a: 1, e: "Centripetal force is the necessary inward force to keep moving in a circle.", n: "When a metal merry-go-round spins violently, the human riders naturally feel a terrifying sensation of being flung outwards. To avoid being thrown onto the pavement, the rider must aggressively lean inward and grip the steel bars. Their arms provide severe tension, acting as the mandatory centripetal tether pulling their body toward the central axis. Without this inward, center-seeking force violently redirecting their momentum, their inertia would launch them in a straight line. They are literally pulling themselves into the curve." },
                    { q: "If the line of action of a force passes exactly through the pivot, the moment is:", o: ["Maximum", "Minimum", "Zero", "Infinite"], a: 2, e: "The perpendicular distance is zero, so Force × 0 = 0.", n: "The mechanical equation defining torque is utterly merciless: Moment equals Force multiplied by Distance. If you stubbornly push a door directly into its metal hinges, the line of your force aims dead center through the pivot point. This geometric mistake aggressively crushes the crucial distance variable down to absolute zero. No matter if you push with ten Newtons or ten thousand, multiplying by zero inevitably yields zero rotation. It is the ultimate lesson in the importance of mechanical placement." },
                    { q: "The force of friction between tires and a curved road provides:", o: ["Translational motion", "Centrifugal force", "Centripetal force", "Upward thrust"], a: 2, e: "Friction pulls the car toward the inside of the curve, keeping it from sliding off.", n: "When a two-ton vehicle attempts to navigate a sharp, curving highway, its immense inertia desperately wants to plow straight into the guardrails. The only thing preventing disaster is the aggressive grip of the rubber tires tearing against the asphalt. This specific lateral friction forcefully shoves the vehicle inwards, pointing directly toward the center of the road's curve. This frictional shove acts as the vital centripetal force required to bend the car's trajectory. If black ice ruins this friction, the centripetal leash snaps instantly." },
                    { q: "When a stone tied to a string is whirled, if the string breaks, it flies off:", o: ["Inwards", "Tangentially", "Straight up", "Straight down"], a: 1, e: "Due to inertia of direction, it continues in a straight line tangent to the circle.", n: "A whirling stone is held in its violent circular prison entirely by the inward centripetal tension of the string. According to Newton's First Law, the stone constantly desires to travel in a perfectly straight, unbending line. The microscopic millisecond that the string suddenly snaps, the inward leash is instantly vaporized to zero. Freed from the curve, the stone's inertia takes absolute control, launching it perfectly straight along the tangential edge. It immediately resumes its preferred linear destiny." },
                    { q: "A couple consists of two forces that are:", o: ["Equal, parallel, same direction", "Equal, parallel, opposite direction", "Unequal, opposite direction", "Perpendicular"], a: 1, e: "A couple must be equal in size, parallel, but acting in opposite directions.", n: "The mechanical definition of a 'couple' is incredibly strict and unforgiving. It demands the presence of two completely identical forces that are perfectly parallel to one another. Crucially, they must aggressively pull in exactly opposite directions, like two hands turning a stubborn steering wheel. Because they push equally in opposite ways, they perfectly annihilate any chance of shoving the object across the room. Their only remaining purpose is to combine their leverage into a massive, pure rotational spin." },
                    { q: "The centre of gravity of a hollow cone is at a height of ___ from its base.", o: ["h/2", "h/3", "h/4", "h/5"], a: 1, e: "Unlike a solid cone (h/4), a hollow cone's mass is distributed differently, placing CG at h/3.", n: "A hollow cone, like a thin paper party hat, entirely lacks a dense, heavy internal core. Because all its mass is stretched thinly across its sloping exterior shell, its overall gravitational balance shifts dramatically upward compared to a solid block. The mathematical average of this thin shell pulls the centre of gravity up to exactly one-third (h/3) of the total height. This makes hollow conical structures noticeably less stable and easier to tip over than their solid (h/4) counterparts. Hollow geometry changes everything." },
                    { q: "Does the position of the centre of gravity change if the body is deformed?", o: ["Yes", "No", "Only if melted", "Never"], a: 0, e: "CG depends on the distribution of mass. If shape changes, CG usually changes.", n: "The centre of gravity is absolutely not a permanent physical tattoo stamped onto an object's surface. It is a highly sensitive mathematical coordinate that recalculates the moment mass shifts. If you violently smash a car or bend a long metal pole, the physical location of the heavy material is drastically relocated. This new geometry forces the invisible balancing point to aggressively migrate to a new location to maintain the average. Shape entirely dictates the location of balance." },
                    { q: "A mechanic applies a force of 50N at the end of a 0.2m long spanner. The moment is:", o: ["10 N m", "100 N m", "250 N m", "0.1 N m"], a: 0, e: "50 N × 0.2 m = 10 N m.", n: "This scenario represents the purest application of the fundamental torque equation. The mechanic invests a moderate physical push of 50 Newtons. The spanner brilliantly leverages this push by placing it a full 20 centimeters (0.2 meters) away from the stubborn bolt. Multiplying the 50N force by the 0.2m distance yields a final, crushing rotational twist of exactly 10 N m. This clean calculation proves how simple leverage multiplies human biology into mechanical superiority." },
                    { q: "The principle of moments is based on the law of conservation of:", o: ["Mass", "Energy", "Momentum", "Force"], a: 1, e: "In rotational equilibrium, the work done (energy) on both sides balances out.", n: "When a see-saw is perfectly locked in horizontal equilibrium, it isn't just balancing forces; it's balancing potential energy. If the board were to slightly tilt, the heavy load dropping would release energy, while the effort rising would consume energy. The principle of moments ensures that the hypothetical work done on both sides of the fulcrum would be mathematically identical. Because no net energy can be created or destroyed, the system sits in a frozen, balanced stalemate. It is thermodynamics keeping the board flat." },
                    { q: "A single force applied to a free body produces:", o: ["Only rotation", "Only translation", "Both translation and rotation", "No motion"], a: 1, e: "If the body is not pivoted, a single force pushes it in a straight line (translation).", n: "Imagine a heavy wooden block resting perfectly unhinged on a frictionless sheet of ice. If you apply a single, aggressive shove squarely into its center of mass, there is no pivot to force a turn. The block has no choice but to absorb the energy and slide perfectly forward in a straight, unbending line. This pure, linear journey is defined strictly as translational motion. Without a hinge or an off-center strike to create a moment, rotation is impossible." },
                    { q: "Can a body have zero mass but have weight?", o: ["Yes", "No", "Only in space", "Only in liquids"], a: 1, e: "Weight depends on mass (W=mg). If mass is zero, weight must be zero.", n: "Mass is the fundamental, unchanging biological or atomic bulk of an object. Weight is merely the secondary effect of a planet's gravity pulling aggressively on that specific bulk. The famous equation (W=mg) explicitly proves that if the mass variable drops to zero, the entire calculation instantly collapses to zero. A true massless entity, like a photon of light, cannot be weighed on a scale because gravity has no physical substance to grab onto. No bulk means no weight." },
                    { q: "The turning effect is maximum when the angle between force and the radius/handle is:", o: ["0 degrees", "45 degrees", "90 degrees", "180 degrees"], a: 2, e: "Applying force perfectly perpendicular (90°) gives the maximum moment.", n: "When manipulating a wrench, the angle of your push dictates your ultimate success or failure. Pushing inwards at a sloppy angle wastes a massive portion of your energy trying to crush the wrench into the bolt. To extract absolute maximum torque, your force must strike the handle at a flawless, razor-sharp 90-degree perpendicular intersection. This perfect angle ensures 100% of your muscular effort is channeled directly into spinning the metal. It is the geometry of maximum efficiency." },
                    { q: "Why is a long handle provided on a hand flour grinder?", o: ["To decrease moment", "To increase distance and decrease effort", "To look traditional", "To increase weight"], a: 1, e: "A larger radius means you need to apply less effort to grind the flour.", n: "A traditional hand flour grinder features two massive, heavy stone wheels that generate immense, stubborn friction when crushing wheat. Attempting to spin these stones from the center would demand exhausting, bone-crushing effort from the miller. By attaching a significantly elongated wooden handle to the outer edge, the designer artificially inflates the radius. This vast increase in perpendicular distance allows the miller to generate the massive required torque using only a gentle, sweeping push. It saves the worker's back through clever leverage." },
                    { q: "When a planetary orbit is elliptical, is the motion uniform circular motion?", o: ["Yes", "No", "Only near the sun", "Only far from sun"], a: 1, e: "An ellipse is not a perfect circle, and speed changes as it gets closer to the sun.", n: "Uniform circular motion demands a flawless, mathematically perfect circle and a strictly unchanging speedometer reading. An elliptical orbit, however, is a stretched, oval-like pathway where the planet occasionally dives close to the sun and then swings far away. As the planet nears the massive solar gravity well, it is violently violently accelerated, significantly increasing its speed. Because neither the radius nor the speed remains constant, it utterly fails the definition of uniform circular motion. It is dynamic, chaotic orbital mechanics." },
                    { q: "The moment of a force of 5N is 2 Nm. What is the perpendicular distance?", o: ["0.4 m", "2.5 m", "10 m", "0.2 m"], a: 0, e: "Moment = F × d. 2 = 5 × d. d = 2/5 = 0.4 m.", n: "This question flips the standard torque equation to test your algebraic understanding of mechanics. We know the final rotational output is 2 Nm, and we know the aggressive input force was 5 Newtons. By dividing the total moment (2) by the force (5), we can mathematically reverse-engineer the missing geometry. The division flawlessly reveals that the mechanic's hand was placed exactly 0.4 meters away from the pivot. It proves that the three variables are permanently locked in a rigid relationship." },
                    { q: "Centrifugal force is a real force: True or False?", o: ["True", "False", "Only in space", "Depends on observer"], a: 1, e: "It is a fictitious or apparent force resulting from inertia in a rotating frame.", n: "When a car swerves violently, your body smashes into the side door, making centrifugal force feel terrifyingly real. However, classical physics coldly categorizes this outward push as entirely fictitious. There is no invisible hand actually pushing you into the glass; it is merely your body's stubborn inertia attempting to travel in a straight line while the car turns into you. It only appears to exist because you are trapped inside a rotating, chaotic environment. To a stationary observer on the sidewalk, you are just going straight." },
                    { q: "A door is 1m wide. A force of 10N is applied at the very edge. Moment is:", o: ["5 Nm", "10 Nm", "20 Nm", "1 Nm"], a: 1, e: "10 N × 1 m = 10 Nm.", n: "This scenario represents the absolute most efficient method for operating a heavy wooden door. By placing your hand on the extreme outer edge, you capitalize on the entire 1-meter width as your lever arm. You push with a moderate 10 Newtons of force, which is immediately multiplied by that full 1-meter distance. The simple calculation yields a highly effective 10 Nm turning moment. It flawlessly demonstrates why door knobs are never placed in the center of the wood." },
                    { q: "If the same 10N force is applied to the middle of the 1m door, the moment is:", o: ["10 Nm", "5 Nm", "20 Nm", "0 Nm"], a: 1, e: "Distance is now 0.5m. 10 N × 0.5 m = 5 Nm.", n: "This scenario highlights the severe penalty of ignoring proper mechanical leverage. By stubbornly pushing on the dead center of the door, you have foolishly slashed your effective distance from 1 meter down to 0.5 meters. While you are still exhausting yourself pushing with the exact same 10 Newtons, the crippled distance halves your final output. The resulting torque plummets to a measly 5 Nm, making the door feel twice as heavy and stubborn. Wasted distance equals wasted effort." },
                    { q: "Where is the C.G. of a uniform rectangular lamina?", o: ["Intersection of diagonals", "One corner", "Midpoint of a long side", "Midpoint of a short side"], a: 0, e: "It balances exactly at the geometric center, where diagonals cross.", n: "A uniform rectangular lamina, like a pristine sheet of heavy glass, distributes its weight with flawless, four-sided symmetry. To find its invisible balancing sweet spot, engineers draw two long, straight diagonals connecting the opposing corners. The exact coordinate where these two lines violently intersect marks the absolute geometric center of the rectangle. This intersection is the undeniable centre of gravity. If you carefully place a pedestal dead center on that intersection, the massive glass will balance horizontally without tipping." },
                    { q: "If a body is pivoted, the reaction force at the pivot:", o: ["Creates a large moment", "Creates a small moment", "Creates zero moment", "Cancels the effort"], a: 2, e: "The reaction force passes exactly through the pivot (distance=0), so its moment is zero.", n: "When a massive see-saw is loaded with children, the central metal fulcrum pushes upward with an incredibly violent reaction force to prevent the board from snapping. However, because this massive force acts directly dead-center through the pivot axis, its geometric distance is absolutely zero. Multiplying this massive reaction force by zero distance mathematically guarantees it generates zero rotational torque. Therefore, the pivot itself can safely support tons of weight without ever accidentally causing the board to spin. It is the quiet anchor." },
                    { q: "The gravitational unit of moment of force is:", o: ["N m", "Dyne cm", "kgf m", "Joule"], a: 2, e: "Kilogram-force meter (kgf m) uses the gravitational unit of force.", n: "While the SI system strictly prefers the abstract Newton-meter, the gravitational unit (kgf m) remains deeply entrenched in practical, heavy-duty engineering. It translates theoretical torque into a highly visual, biological reality. One kgf m is precisely the rotational twist you would feel if you hung a heavy one-kilogram iron weight exactly one meter out on a steel bar. It allows mechanics and structural engineers to intuitively 'feel' the twisting forces they are calculating. It bridges the gap between math and heavy reality." },
                    { q: "A uniform half-metre rule balances at the 25cm mark. True or False?", o: ["True", "False", "Depends on material", "Depends on weight"], a: 0, e: "A half-metre rule is 50cm long, so its midpoint and CG is at 25cm.", n: "A standard half-metre rule is exactly 50 centimeters in total length from tip to tip. Because the word 'uniform' guarantees the plastic or wood is perfectly consistent in density, its mass is distributed with flawless symmetry. This symmetry mandates that the invisible centre of gravity rests at the absolute geometric midpoint. Slicing 50cm exactly in half yields the 25cm mark as the undeniable center. Placing a sharp wedge exactly under the 25cm line will result in perfect, horizontal levitation." },
                    { q: "If a body moves at a constant speed in a circle, its kinetic energy:", o: ["Increases", "Decreases", "Remains constant", "Becomes zero"], a: 2, e: "KE = 1/2 mv^2. Since speed (magnitude of v) is constant, KE is constant.", n: "Kinetic energy is a beautifully simple scalar quantity, meaning it is completely blind and deaf to directional changes. Its governing formula (KE = ½mv²) cares strictly about the raw, numerical magnitude of the object's speed, not its compass heading. Even though an orbiting satellite is constantly violently changing direction (accelerating), its actual speedometer reading never flinches. Because the speed variable remains rigidly locked, the resulting kinetic energy calculation remains stubbornly constant. Directional chaos does not alter scalar energy." },
                    { q: "A couple does not produce translational motion because:", o: ["Forces are weak", "Resultant force is zero", "Distance is large", "It only acts on pivots"], a: 1, e: "The two forces are equal and opposite, so they cancel out linearly (net force = 0).", n: "The architectural genius of a mechanical couple lies in its ability to isolate spin from shove. It employs two completely equal forces that aggressively push in perfectly opposite directions. If you attempt to add these two vectors together algebraically, they viciously annihilate each other, leaving a net linear force of absolute zero. Because there is zero leftover linear push, the object is completely barred from sliding or translating across the floor. 100% of the energy is safely funneled into generating pure rotation." }
                ]
            },
            ch2: {
                title: "Chapter 2: Work & Energy (Medium Level)",
                questions: [
                    { q: "If a force of 10N displaces a body by 2m in its own direction, work done is:", o: ["5 J", "20 J", "12 J", "8 J"], a: 1, e: "W = F × d = 10 × 2 = 20 Joules.", n: "The calculation of fundamental mechanical work is delightfully straightforward when the geometry aligns perfectly. Here, an aggressive 10 Newton push successfully forces a heavy block to slide exactly 2 meters forward. Because the block surrendered and moved in the exact parallel direction of the shove, the cosine angle is zero (cos 0 = 1). We simply multiply the force (10) by the displacement (2) to calculate the energy transferred. The result is a clean, efficient 20 Joules of successful mechanical work." },
                    { q: "1 kWh is equal to how many Joules?", o: ["3.6 × 10^3", "3.6 × 10^4", "3.6 × 10^5", "3.6 × 10^6"], a: 3, e: "1000 W × 3600 s = 3,600,000 J = 3.6 × 10^6 J.", n: "The Kilowatt-hour (kWh) is a massive, industrial-scale bucket used to measure household electricity. To decode it into standard scientific Joules, you must unpack its definition. One Kilowatt equals a steady flow of 1,000 Joules every single second. An hour contains exactly 3,600 ticking seconds. Multiplying that heavy 1,000 Joule flow by 3,600 seconds yields an astronomical 3,600,000 Joules of total delivered energy. It proves that leaving an appliance on for an hour burns a staggering amount of raw energy." },
                    { q: "A man carries a 20kg box on his head and walks 10m horizontally. Work done against gravity is:", o: ["200 J", "2000 J", "Zero", "100 J"], a: 2, e: "Force of gravity is vertical, displacement is horizontal. Angle is 90, so work is zero.", n: "This scenario perfectly illustrates the harsh, counter-intuitive reality of physics compared to biological exhaustion. The man is sweating, burning intense calories to physically support the crushing 20kg box against vertical gravity. However, his walking motion entirely constitutes horizontal, sideways displacement across the flat floor. Because the vertical downward pull of gravity and the horizontal forward movement intersect at a harsh 90-degree angle, the mathematical cosine is zero. Physics dictates he performed absolutely zero mechanical work against the gravitational field." },
                    { q: "A machine does 500J of work in 10 seconds. Its power is:", o: ["5000 W", "50 W", "0.02 W", "5 W"], a: 1, e: "Power = Work / Time = 500 / 10 = 50 Watts.", n: "Power acts as the merciless stopwatch judging how rapidly a machine can empty its energy reserves. This specific machine successfully churned through a very respectable 500 Joules of heavy mechanical work. However, by taking a leisurely 10 full seconds to finish the task, its intensity is diluted. Dividing the 500 Joules by the 10 seconds reveals it was only delivering energy at a slow trickle of 50 Joules per second. Therefore, its official rating is a modest 50 Watts." },
                    { q: "If the velocity of a moving car is doubled, its kinetic energy becomes:", o: ["Double", "Half", "Four times", "Remains same"], a: 2, e: "KE = 1/2 mv^2. If v is doubled, (2)^2 = 4, so KE is multiplied by 4.", n: "The kinetic energy equation hides a terrifying, exponential truth within the velocity variable, which is strictly squared. If a reckless driver decides to simply double their cruising speed, they are not merely doubling their momentum. The math dictates that squaring a doubled speed (2²) violently quadruples the vehicle's destructive kinetic energy. This means the brakes now have to dissipate four times as much heat, and an impact would be four times as deadly. Speed is the absolute tyrant of kinetic destruction." },
                    { q: "A body of mass 2kg falls from a height of 5m. What is its potential energy at the top? (g=10 m/s2)", o: ["10 J", "50 J", "100 J", "20 J"], a: 2, e: "PE = mgh = 2 × 10 × 5 = 100 Joules.", n: "Before this heavy object is dropped, it sits frozen at the precipice, fully charged like a heavy battery. To calculate its stored potential, we must multiply three critical factors: its 2kg mass, the 10 m/s² aggressive pull of local gravity, and its towering 5-meter height. The straightforward multiplication (2 x 10 x 5) yields exactly 100. This confirms that the object holds a dormant, invisible reservoir of 100 Joules of gravitational potential energy. It is quietly waiting for the floor to vanish." },
                    { q: "Using conservation of energy, what will be the kinetic energy of the 2kg body from the previous question just before it hits the ground?", o: ["0 J", "50 J", "100 J", "200 J"], a: 2, e: "All the 100J of potential energy at the top converts entirely to 100J of kinetic energy at the bottom.", n: "The majestic law of energy conservation dictates that isolated energy cannot simply vanish into the ether. As the heavy 2kg object plummets, its initial 100-Joule reservoir of height-based potential energy rapidly bleeds away. However, every single lost Joule is instantly and perfectly converted into raw, accelerating kinetic speed. In the microsecond before it violently strikes the concrete, its height hits zero, meaning all potential is gone. Therefore, it impacts the ground armed with a perfectly converted 100 Joules of kinetic fury." },
                    { q: "Relation between Kinetic Energy (K) and Momentum (p) is:", o: ["K = p/2m", "K = p^2 / 2m", "p = K^2 / 2m", "K = 2mp"], a: 1, e: "Since p = mv, K = 1/2 m (p/m)^2 = p^2 / 2m.", n: "Kinetic energy (scalar) and momentum (vector) are two deeply intertwined mathematical siblings describing a moving object. By isolating the velocity variable in the momentum equation (v = p/m) and violently injecting it into the kinetic energy formula, engineers derive a beautiful shortcut. The resulting equation, K = p²/2m, elegantly allows you to calculate raw energy using only mass and momentum, bypassing velocity entirely. This relationship is critical in advanced collision forensics and quantum physics. It links mass, speed, and impact." },
                    { q: "Two bodies A and B of masses m and 2m have the SAME momentum. Which has more Kinetic Energy?", o: ["Body A", "Body B", "Both same", "Cannot be determined"], a: 0, e: "K = p^2 / 2m. Since mass is in the denominator, the lighter body (A) has MORE kinetic energy.", n: "This presents a fascinating, highly counter-intuitive physics puzzle regarding high-speed impacts. Both the light bullet (A) and the heavy bowling ball (B) possess the exact same raw momentum vector. However, looking at the derived formula (K = p²/2m), the object's mass resides stubbornly in the denominator. Because the lighter bullet forces you to divide by a much smaller mass, the final kinetic energy value skyrockets. The lighter object must be traveling at terrifying speeds to match the momentum, giving it vastly superior destructive energy." },
                    { q: "Work done by a force is negative when the angle between force and displacement is:", o: ["0 degrees", "90 degrees", "180 degrees", "45 degrees"], a: 2, e: "Cos(180) = -1. The force is acting in the opposite direction to the movement (like friction).", n: "Negative work sounds like a paradox, but it perfectly describes forces that act as mechanical brakes. If a heavy sled is sliding aggressively forward, but friction is violently scraping backward against the floor, their vectors directly oppose each other. This creates a harsh, flat 180-degree angle between the direction of travel and the resisting force. Because the mathematical cosine of 180 degrees is exactly -1, the resulting calculation is a negative energy value. This force is actively stealing energy, slowing the sled." },
                    { q: "A pump raises 50kg of water to a height of 10m in 5 seconds. What is its power? (g=10 m/s2)", o: ["100 W", "500 W", "1000 W", "5000 W"], a: 2, e: "Work = mgh = 50 × 10 × 10 = 5000 J. Power = 5000 / 5 = 1000 Watts.", n: "Evaluating this heavy-duty water pump requires a strict two-step mechanical audit. First, we calculate the brute work required to defeat gravity by lifting the 50kg payload up 10 meters, which demands 5,000 Joules of energy (50x10x10). Second, we judge the pump's speed by dividing that massive 5,000-Joule workload by the incredibly brief 5-second timeframe it took to finish. The math reveals an aggressive flow of 1,000 Joules every second. Therefore, the pump boasts a powerful rating of 1,000 Watts." },
                    { q: "1 electron-volt (eV) is equal to:", o: ["1.6 × 10^-19 J", "1.6 × 10^19 J", "9.1 × 10^-31 J", "1 J"], a: 0, e: "1 eV is the energy gained by an electron. It is a very tiny unit of energy.", n: "When physicists dive into the microscopic, quantum realm of atoms, the standard Joule becomes laughably massive and clumsy to use. Instead, they utilize the electron-volt (eV), a specialized, microscopic bucket for measuring energy. It represents the exact, tiny jolt of energy a single electron gains when accelerated across a one-volt electrical field. This equates to an incomprehensibly small fraction of a Joule (1.6 × 10^-19). It is the standard currency for measuring x-rays, lasers, and nuclear radiation." },
                    { q: "Which of the following is an example of potential energy converting to kinetic energy?", o: ["A car accelerating", "A stretched rubber band released", "Winding a clock", "Boiling water"], a: 1, e: "The stored elastic PE in the band turns into KE as it snaps forward.", n: "A stretched rubber band represents a masterclass in storing dormant mechanical potential. By pulling the band back, your fingers force energy deep into the distorted polymer chains, stockpiling elastic potential energy. The band desperately wants to return to its relaxed state but is held back by your grip. The instant you release it, the dam breaks, and that stored potential violently transforms into snapping, high-speed kinetic energy. It perfectly illustrates how energy can be frozen and suddenly thawed." },
                    { q: "A 100W bulb is used for 10 hours. How much electrical energy is consumed in kWh?", o: ["10 kWh", "100 kWh", "1 kWh", "0.1 kWh"], a: 2, e: "Energy = Power (in kW) × Time (in h) = 0.1 kW × 10 h = 1 kWh.", n: "Calculating a residential electricity bill requires translating raw Watts into commercial Kilowatt-hours. First, we must downsize the 100-Watt bulb by dividing by 1,000, revealing it consumes a meager 0.1 Kilowatts of power. However, it was left burning steadily for a highly extended period of 10 solid hours. Multiplying the 0.1 kW rate by the 10-hour duration perfectly equals 1.0 kWh. This proves that a modest bulb left on overnight consumes exactly one full 'unit' of grid electricity." },
                    { q: "If two bodies have equal kinetic energies, the one with greater mass will have:", o: ["Less momentum", "More momentum", "Equal momentum", "Zero momentum"], a: 1, e: "p = √(2mK). If K is constant, the one with larger mass (m) has larger momentum (p).", n: "This scenario pits a speeding bullet against a slowly rolling boulder, assuming both pack the exact same kinetic punch. Despite their equal energy, momentum (p) relies heavily on sheer physical bulk. The mathematical formula linking them (p = √(2mK)) proves that if the energy (K) is locked, increasing the mass (m) inevitably drives up the momentum. Therefore, the heavy, slow boulder possesses drastically more unstoppable momentum than the lightning-fast bullet. This is why heavy trucks are so lethally difficult to halt." },
                    { q: "When a pendulum swings to its extreme highest point, its energy is:", o: ["Only Kinetic", "Only Potential", "Half KE, Half PE", "Zero"], a: 1, e: "It stops momentarily at the extreme point, so KE is zero and PE is maximum.", n: "A swinging pendulum serves as a hypnotic, real-time display of energy conversion. As the heavy metal bob swings upward against gravity, it fights a losing battle, bleeding off speed and kinetic energy. At the absolute extreme apex of its arc, it violently halts for a microscopic fraction of a second before reversing. In that frozen moment, its velocity is zero, meaning its kinetic energy is absolutely dead. 100% of its energy has been successfully banked as gravitational potential, waiting to fall." },
                    { q: "When a pendulum swings through its lowest middle point, its energy is:", o: ["Only Kinetic", "Only Potential", "Half KE, Half PE", "Zero"], a: 0, e: "It has lost all its height (PE=0) and is moving at its fastest speed (KE is max).", n: "The exact opposite extreme occurs when the pendulum bob plunges through the absolute lowest point of its sweeping arc. At this bottom-dead-center position, it has surrendered every inch of its vertical altitude, meaning its gravitational potential energy has flatlined to zero. However, all that lost height was aggressively converted into accelerating speed. Consequently, it tears through the middle point at its absolute maximum velocity. Here, its energy is purely, 100% kinetic fury." },
                    { q: "What is the relation between Joule and Erg?", o: ["1 J = 10^5 erg", "1 J = 10^7 erg", "1 J = 10^-7 erg", "1 J = 10^3 erg"], a: 1, e: "1 Joule = 1 N × 1 m = 10^5 dyne × 10^2 cm = 10^7 erg.", n: "Bridging the gap between the modern SI Joule and the archaic CGS erg requires massive mathematical scaling. One Joule represents the work of one Newton (10^5 dynes) pushing across one whole meter (10^2 centimeters). When you multiply these massive CGS conversions together (10^5 * 10^2), the exponents combine aggressively. The final result proves that a single, standard Joule is composed of an astonishing ten million (10^7) microscopic ergs. It perfectly illustrates how tiny historical units really were." },
                    { q: "A ball is thrown up. During its upward journey, the work done by gravity is:", o: ["Positive", "Negative", "Zero", "Maximum"], a: 1, e: "Displacement is UP, but gravity pulls DOWN (180 degrees). Work is negative.", n: "When a baseball is aggressively pitched straight up into the sky, it is actively fighting the planet. The ball's physical displacement vector is pointing triumphantly upward into the clouds. However, the Earth's gravitational pull is a stubborn force vector pointing violently downwards toward the dirt. Because these two vectors are perfectly opposed at a 180-degree angle, gravity acts as a harsh braking mechanism. Therefore, the work done by gravity is strictly mathematically negative, stealing the ball's kinetic energy." },
                    { q: "A spring is compressed. Its potential energy:", o: ["Increases", "Decreases", "Remains same", "Becomes zero"], a: 0, e: "Doing work to compress it stores energy inside it as elastic potential energy.", n: "A heavy steel spring is essentially an empty reservoir waiting to be filled with physical energy. When a mechanic uses brutal force to squeeze the coils tightly together, they are actively performing heavy mechanical work on the metal. This invested energy does not simply vanish; it is forced deep into the deformed atomic structure of the steel. The spring greedily absorbs this effort, violently increasing its internal elastic potential energy. It is now a loaded weapon, desperate to violently expand." },
                    { q: "A girl weighing 400N climbs a vertical ladder 2m high. Work done is:", o: ["200 J", "800 J", "400 J", "Zero"], a: 1, e: "Work = Force (weight) × height = 400 × 2 = 800 J.", n: "Climbing a vertical ladder is the purest form of performing mechanical work directly against planetary gravity. The girl's muscles must generate a continuous 400-Newton upward force simply to match her own biological weight. By successfully hauling that 400-Newton weight up a vertical displacement of 2 full meters, she fulfills the core work equation. Multiplying her weight by her vertical journey (400 x 2) yields a massive 800 Joules. She has successfully banked 800 Joules of potential energy." },
                    { q: "Which energy transformation takes place in a glowing heater?", o: ["Heat to Light", "Electrical to Heat", "Chemical to Heat", "Light to Heat"], a: 1, e: "Electricity passes through the coils, generating primarily heat.", n: "A residential space heater is a brute-force machine designed to violently harvest energy from the grid. It operates by forcing a massive tide of electrical current through specialized, highly resistive metal alloy coils. The intense atomic friction generated by this electrical traffic jam forces the metal to become blisteringly hot. It flawlessly and aggressively converts the invisible electrical energy into radiating thermal heat to warm the room. The faint orange glow is merely a tiny byproduct of this massive thermal transformation." },
                    { q: "Solar energy is considered better than fossil fuels because it is:", o: ["Non-renewable and polluting", "Renewable and non-polluting", "Cheaper to set up initially", "Available 24/7"], a: 1, e: "It is a clean, infinite source of energy (though not available at night).", n: "The global push toward solar technology is driven by two undeniable environmental realities. First, the sun is a renewable fusion reactor that will continue to bombard the Earth with free photons for another five billion years, making it practically infinite. Second, capturing these photons with silent solar panels generates absolutely zero toxic emissions, smog, or greenhouse gases. While it suffers from nighttime unreliability, it entirely sidesteps the pollution and eventual depletion guaranteed by burning dirty fossil fuels. It is the cleanest battery." },
                    { q: "A boy pushes a heavy rock for 10 minutes but it doesn't move. Work done by the boy is:", o: ["Maximum", "Negative", "Zero", "Positive"], a: 2, e: "No displacement means no mechanical work is done.", n: "This scenario is the ultimate frustration of rigid physical definitions clashing with human biology. The boy is undoubtedly sweating, his muscles are burning ATP, and his heart rate is spiking from extreme exertion. However, the unyielding rock stubbornly refuses to shift even a single millimeter across the dirt. Because the physical displacement variable remains locked at absolute zero, the work equation demands a final answer of zero. The boy expelled massive chemical energy, but accomplished absolutely zero mechanical work." },
                    { q: "If the mass of a body is halved and velocity is doubled, its Kinetic Energy becomes:", o: ["Same", "Double", "Half", "Four times"], a: 1, e: "KE = 1/2 (m/2) (2v)^2 = 1/2 (m/2) (4v^2) = 2 × (1/2 mv^2). It doubles.", n: "This physics puzzle brutally tests your understanding of how mass and speed differently influence kinetic energy. Slashing the mass in half tries to weaken the energy, cutting it down by 50%. However, doubling the velocity triggers the terrifying squared variable (2² = 4), which aggressively multiplies the energy by four. When you pit the halving effect against the quadrupling effect, the speed multiplier completely dominates the math. The final result is a system with exactly double its original kinetic energy." },
                    { q: "Water at the bottom of a waterfall has slightly higher temperature than at the top due to:", o: ["Sunlight", "Friction with air", "Conversion of KE to Heat", "Chemical reaction"], a: 2, e: "As it crashes, its kinetic energy converts into thermal energy (heat).", n: "A massive waterfall is a chaotic engine of energy transformation. As millions of tons of water plummet over the edge, immense gravitational potential energy is violently converted into roaring kinetic speed. When this high-speed water brutally smashes into the rocks below, that kinetic energy cannot just vanish. The violent collision forces the water molecules to aggressively vibrate against each other, converting the impact energy directly into thermal heat. Consequently, the turbulent pool at the bottom is measurably, undeniably warmer." },
                    { q: "A machine lifts a load of 1000N through 2m in 5s. Power is:", o: ["400 W", "2000 W", "100 W", "5000 W"], a: 0, e: "Work = 1000 × 2 = 2000 J. Power = 2000 / 5 = 400 W.", n: "Evaluating the prowess of this heavy lifting machine requires a strict two-part mechanical breakdown. First, the brute work accomplished is calculated by multiplying the massive 1000-Newton load by the 2-meter vertical climb, yielding 2000 Joules of successful work. Second, we evaluate the speed by dividing that 2000-Joule effort by the quick 5-second operational window. The math proves the machine successfully delivered 400 Joules every single second. Therefore, it officially boasts a highly capable rating of 400 Watts." },
                    { q: "In an electromagnet, the energy conversion is:", o: ["Magnetic to Electrical", "Electrical to Magnetic", "Mechanical to Magnetic", "Chemical to Magnetic"], a: 1, e: "An electric current produces a magnetic field.", n: "An electromagnet is a brilliant technological cheat code that creates magnetism entirely on demand. It consists of a heavy coil of copper wire securely wrapped around an iron core. The moment you flip the switch, aggressive electrical energy violently surges through the coils. This flowing electricity instantly forces a massive, invisible magnetic field to blossom around the iron core. It represents the flawless, on-demand conversion of flowing electrical energy into powerful, gripping magnetic energy. It is the secret behind junkyard cranes." },
                    { q: "The energy possessed by wind is primarily:", o: ["Potential Energy", "Kinetic Energy", "Heat Energy", "Chemical Energy"], a: 1, e: "Wind is moving air, so it possesses kinetic energy.", n: "Wind is frequently misunderstood as a mystical force, but it is physically just a colossal mass of atmospheric gases aggressively relocating. Because this incredibly heavy volume of nitrogen and oxygen is actively sweeping across the landscape at high velocities, it is packed with raw energy. By definition, any mass currently in motion is utilizing kinetic energy. Modern wind turbines are meticulously engineered to intersect this rushing air, harvesting its immense kinetic power to violently spin their massive generators." },
                    { q: "A flying aeroplane possesses:", o: ["Only KE", "Only PE", "Both KE and PE", "Zero energy"], a: 2, e: "It is moving (KE) and it is at a height above ground (PE).", n: "A commercial airliner cruising at 30,000 feet represents a terrifyingly massive stockpile of dual-state energy. Because it is roaring across the sky at 500 miles per hour, its massive bulk possesses an astronomical amount of kinetic energy. Simultaneously, because it has successfully clawed its way miles above the Earth's surface, it has stockpiled a massive reservoir of gravitational potential energy. This combined sum represents its total mechanical energy. Both energy types must be aggressively managed and bled off during a safe landing." },
                    { q: "In a hydroelectric plant, the sequence of energy is:", o: ["PE -> KE of water -> KE of turbine -> Electrical", "KE -> PE -> Electrical", "Electrical -> KE -> PE", "Heat -> KE -> Electrical"], a: 0, e: "Stored water (PE) falls (KE), turns the turbine (KE), creating electricity.", n: "A massive hydroelectric dam operates as a highly orchestrated, multi-stage energy domino effect. It begins with millions of tons of water held silently at a massive height, brooding with immense Potential Energy. When released, the water plunges down concrete tubes, violently transforming that potential into roaring Kinetic Energy. This rushing water violently smashes into heavy turbine blades, transferring the Kinetic Energy into spinning mechanical metal. Finally, the spinning generators rip electrons loose, finalizing the translation into usable Electrical Energy." },
                    { q: "If a force is applied at an angle of 60 degrees to the displacement, work done is:", o: ["F × d", "F × d × 0.5", "Zero", "F × d × 0.866"], a: 1, e: "W = Fd cos(60). Since cos(60) = 0.5, W = 0.5 Fd.", n: "Applying force at a sloppy angle is mathematically disastrous for mechanical efficiency. If you drag a heavy sled by pulling a rope pitched upward at a steep 60-degree angle, a massive portion of your effort is wasted pulling uselessly into the sky. The physics equation brutally punishes this inefficiency by multiplying your effort by the cosine of 60 degrees, which is exactly 0.5. This math proves that exactly half of your hard-earned pushing power is completely wasted. Only the horizontal component does real work." },
                    { q: "Which of the following does NOT represent power?", o: ["Work / Time", "Force × Velocity", "Energy × Time", "Voltage × Current"], a: 2, e: "Power is Energy DIVIDED by Time, not multiplied.", n: "Power is strictly defined as the aggressive rate of energy consumption or work delivery. To find a rate, you must mathematically divide the total amount by the time it took to happen, just like miles divided by hours gives speed. Multiplying energy by time creates a completely nonsensical, bloated mathematical unit that describes absolutely nothing in classical physics. Valid shortcuts include multiplying Force by Velocity or Voltage by Current. Time must always remain in the punishing denominator." },
                    { q: "A cell (battery) while discharging converts:", o: ["Electrical to Chemical", "Chemical to Electrical", "Heat to Chemical", "Chemical to Heat"], a: 1, e: "The internal chemical reaction produces an electrical current.", n: "When you slap a fresh battery into a flashlight and flick the switch, you are authorizing a violent internal reaction. The sealed casing holds highly reactive compounds that are desperate to interact and swap electrons. Discharging the battery allows this controlled chemical digestion to proceed, violently stripping electrons from the anode. These fleeing electrons are forced through the flashlight bulb, brilliantly converting the stored chemical potential directly into a blazing electrical current. It is controlled chemical degradation." },
                    { q: "A cell (battery) while CHARGING converts:", o: ["Electrical to Chemical", "Chemical to Electrical", "Heat to Chemical", "Chemical to Heat"], a: 0, e: "You push electricity in to reverse the chemical reaction, storing it.", n: "Charging a depleted lithium-ion battery is an act of violent, reverse-engineered physics. You are actively utilizing grid electricity to bully the battery's internal chemicals backward into their original, highly unstable state. The aggressive influx of electrical energy forces the molecules to rebuild their broken bonds, safely trapping the energy back inside the casing. This process flawlessly transforms active, flowing electrical energy into dormant, stabilized chemical potential energy. It effectively rewinds the battery's chemical clock." },
                    { q: "Which has a larger power: Machine A doing 100J in 2s, or Machine B doing 200J in 5s?", o: ["Machine A", "Machine B", "Both equal", "Cannot say"], a: 0, e: "Power A = 100/2 = 50W. Power B = 200/5 = 40W. Machine A has more power.", n: "This comparison perfectly exposes why judging a machine solely by its total workload is a fool's errand. Machine B impressively churned through a massive 200 Joules of total heavy lifting. However, it lazily dragged the job out over 5 long seconds, resulting in a weak, sluggish output of only 40 Watts. Machine A only lifted half the total weight, but it violently sprinted through the task in just 2 seconds, generating a superior 50 Watts of power. Speed dictates mechanical superiority." },
                    { q: "The law of conservation of energy applies to:", o: ["Only mechanical systems", "Only electrical systems", "All isolated systems", "Only living things"], a: 2, e: "It is a universal law applicable to any closed, isolated system.", n: "The absolute conservation of energy is not a mere suggestion; it is the ultimate, unbreakable dictat of the known universe. It does not care if it is judging a grinding mechanical gear, a blazing chemical fire, or the silent decay of a radioactive isotope. Provided the system is completely walled off and isolated from outside interference, the total energy ledger must flawlessly balance to zero. Energy will wildly shift forms and hide in heat or sound, but the absolute total will never, ever change." },
                    { q: "If a body is moved along a circular path, work done by the centripetal force is:", o: ["Positive", "Negative", "Zero", "Infinite"], a: 2, e: "Because centripetal force is always perpendicular (90 deg) to the path.", n: "Centripetal force is arguably the most mathematically frustrating force in orbital physics. It pulls with immense, bone-crushing power perfectly inward toward the center of the circle. Meanwhile, the object is desperately travelling tangentially along the outer rim. Because these two vectors form a perfect, unyielding 90-degree intersection at every single microsecond, the work equation (using cosine 90) collapses entirely to zero. Despite the massive tension required to hold the curve, the inward force contributes absolutely zero forward work." },
                    { q: "Work done by a boy pushing a wall is:", o: ["Positive", "Negative", "Zero", "Maximum"], a: 2, e: "The wall does not move, so displacement is zero. W = 0.", n: "A boy shoving his shoulder into a brick wall is generating massive biological exertion, burning intense amounts of chemical ATP in his muscle fibers. However, classical physics operates as a cruel, unfeeling auditor that strictly ignores biological effort. The only metric that matters is mechanical result. Because the massive brick wall entirely refuses to yield or displace even a fraction of a millimeter, the displacement is zero. Consequently, the mathematical work accomplished is a harsh, uncompromising zero." },
                    { q: "1 MegaWatt (MW) is equal to:", o: ["10^3 W", "10^6 W", "10^9 W", "10^12 W"], a: 1, e: "Mega means one million (10^6).", n: "When engineers discuss the output of massive municipal power plants or nuclear reactors, standard Watts become entirely useless and illegible. To clean up the math, they utilize the heavy-duty SI prefix 'Mega', which universally signifies a multiplication factor of one solid million. Therefore, a single MegaWatt (MW) represents a terrifying, roaring flow of 1,000,000 individual Watts of power. This prefix system prevents critical infrastructure documents from being bogged down by endless strings of zeros. It is the language of industrial power." }
                ]
            },
            ch3: {
                title: "Chapter 3: Machines (Medium Level)",
                questions: [
                    { q: "If a machine has an efficiency of 80% and a Velocity Ratio of 5, its Mechanical Advantage is:", o: ["4", "6.25", "0.16", "5"], a: 0, e: "M.A. = V.R. × Efficiency = 5 × 0.80 = 4.", n: "This calculation reveals the painful truth of internal machine friction. Ideally, a machine with a Velocity Ratio of 5 should grant you a flawless, identical Mechanical Advantage of 5, multiplying your strength immensely. However, this specific machine is plagued by grinding gears, causing it to operate at only 80% efficiency. By multiplying the theoretical V.R. (5) by the harsh reality of the efficiency (0.80), we discover the true output. The actual, realized Mechanical Advantage is crippled down to just 4." },
                    { q: "Why is the mechanical advantage of a Class II lever always > 1?", o: ["Effort arm > Load arm", "Load arm > Effort arm", "Fulcrum is at end", "It has no friction"], a: 0, e: "Because the load is in the middle, the effort is further away, making the effort arm longer.", n: "The fundamental architecture of a Class II lever guarantees mechanical superiority by trapping the heavy load directly between the front hinge and the rear handles. Because the user is forced to grip the absolute furthest extremity of the lever, their effort arm is geometrically locked to be longer than the load arm. When you divide a large effort arm by a short load arm, the resulting Mechanical Advantage must mathematically exceed 1. This guarantees that pushing a wheelbarrow will always feel lighter than deadlifting the dirt." },
                    { q: "Why is the mechanical advantage of a Class III lever always < 1?", o: ["Effort arm > Load arm", "Load arm > Effort arm", "Fulcrum is at end", "It has no friction"], a: 1, e: "Because the effort is in the middle, it is closer to the fulcrum, making the load arm longer.", n: "Class III levers are deliberately engineered to be terrible force multipliers. By forcing the user to apply their pushing effort awkwardly in the middle of the shaft, they geometrically cripple the effort arm. Meanwhile, the load sits at the far distant tip, creating a massive, dominating load arm. Dividing this tiny effort arm by the massive load arm mathematically dooms the Mechanical Advantage to sit far below 1. The user must push brutally hard, but they are rewarded with blinding tip speed." },
