    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --border: #e2e8f0;

        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);

        }

        /* --- Login Overlay Styles --- */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .login-input:focus { outline: none; border-color: var(--primary); }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .login-btn:hover { opacity: 0.9; }

        .error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
        
        .troubleshoot-btn {
            margin-top: 25px;
            background: none;
            border: none;
            color: var(--text-light);
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        
        .troubleshoot-btn:hover { color: var(--danger); }

        /* --- App Styles --- */
        #app-content { display: none; }
        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);

        header h1 { color: var(--primary-dark); font-size: 2rem; margin-bottom: 5px; }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            font-size: 1.05rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .logout-btn {
            padding: 5px 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .logout-btn:hover { background: #dc2626; }

        .export-all-btn {
            position: absolute;
            top: 20px;

            padding: 8px 16px;
            background-color: var(--text-main);
            color: white;
            border: none;
            border-radius: 6px;

        .export-all-btn:hover { opacity: 0.9; }

        @media (max-width: 600px) {
            .export-all-btn { position: static; display: block; width: 100%; margin-top: 15px; }

        /* Level Tabs */
        .level-tabs { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .level-btn {

            background: var(--surface);

        /* Chapter Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .tab-btn {

            border-radius: 8px;

        /* Score Badge */

        /* Main Content Area */
        .content-card {

        /* Questions */
        .question-block { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); page-break-inside: avoid; }
        .question-block:last-child { border-bottom: none; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 600px) { .options-grid { grid-template-columns: 1fr 1fr; } }

        .option-label {
            display: flex;
            align-items: center;

        /* --- NEW: Feedback Panels Styles --- */

        }

            .feedback-panels { grid-template-columns: 1fr 1fr; }

        .panel {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .panel h4 {
            color: var(--primary-dark);
            margin: 0 0 8px 0;
            font-size: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }
        .panel p { margin: 0; font-size: 0.95rem; color: #334155; line-height: 1.5; }
        .feedback-container.correct .panel { border-left: 4px solid var(--success); background: #f0fdf4; }
        .feedback-container.incorrect .panel { border-left: 4px solid var(--danger); background: #fef2f2; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Buttons */
        .btn { display: inline-block; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center; color: white; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--primary); margin-top: 20px; }
        .btn-secondary { background-color: var(--text-light); margin-top: 10px; }
        .btn-dark { background-color: var(--text-main); margin-top: 10px; }
        .btn-danger { background-color: var(--danger); margin-top: 10px; }

        /* Report Styles */
        .report-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
        .score-box { background: var(--success-bg); border: 2px solid var(--success); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 30px; }
        .score-box h2 { color: var(--success); font-size: 2.5rem; margin: 10px 0; }
        .score-box p { color: #047857; font-weight: 600; font-size: 1.2rem; }

        .review-item { padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 6px solid; background: #f8fafc; page-break-inside: avoid; }
        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--danger); }
        
        .review-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; margin-bottom: 10px; }
        .badge-correct { background: var(--success-bg); color: var(--success); }
        .badge-incorrect { background: var(--danger-bg); color: var(--danger); }

    </style>

<!-- Main Application -->
<div id="app-content" class="container">
    <header>
        <h1>Physics Learning Quiz</h1>

        <div class="user-info">
            <span id="welcome-text"></span>

<script>
    const validAccounts = { 'sambhav': '1234', 'roshan': '1234' };

    // --- 240 QUESTIONS DATASET WITH 'LOGIC' (e) AND 'NOTE' (n) ---
    const quizData = {
        easy: {
            ch1: {
                title: "Chapter 1: Force (Easy Level)",
                questions: [
                    { q: "What is the SI unit of Force?", o: ["Joule", "Newton", "Watt", "Pascal"], a: 1, e: "Newton (N) is the standard SI unit of force.", n: "Sir Isaac Newton formulated the essential laws of motion, so the SI unit honors his name. One Newton represents the force required to accelerate a one-kilogram mass by one meter per second squared. It is a derived unit in the International System of Units. Understanding this foundational unit is vital before analyzing complex kinetic interactions. Without it, measuring mechanical effort consistently would be impossible." },
                    { q: "What is the SI unit of moment of force?", o: ["N m", "N/m", "kg m", "Joule"], a: 0, e: "Moment is Force multiplied by distance, so the unit is Newton-meter (N m).", n: "The moment of force measures the turning effect produced by a force applied at a distance from a pivot. It is calculated by taking the product of the force and the perpendicular distance to the axis of rotation. Although it shares the same base units as the Joule (energy), they represent entirely different physical concepts. Moment relies on a directional vector, unlike scalar energy. This distinction is critical in solving equilibrium problems." },
                    { q: "Moment of force is a:", o: ["Scalar quantity", "Vector quantity", "Basic quantity", "Unitless quantity"], a: 1, e: "It has both magnitude and a specific direction of rotation, making it a vector.", n: "Vector quantities require both a magnitude and a specific direction to be fully described. For moment of force, this direction is usually specified as either clockwise or anticlockwise. This rotational vector is sometimes mathematically defined using the right-hand rule in advanced physics. Scalar quantities like mass or temperature completely lack this directional requirement. Properly tracking the direction of moments ensures accurate calculations when balancing a physical system." },
                    { q: "A push or a pull on a body is called:", o: ["Work", "Energy", "Force", "Power"], a: 2, e: "Force is defined fundamentally as a push or a pull.", n: "A force is the primary agent capable of altering a body's state of rest or uniform motion. It can also induce a change in the physical dimensions or shape of an object. In nature, forces manifest in several fundamental forms, including gravitational, electromagnetic, and nuclear interactions. Despite their complexity, everyday mechanical interactions are best simplified as pushes and pulls. This simplification forms the core of classical mechanics." },
                    { q: "The turning effect of a force is known as:", o: ["Thrust", "Pressure", "Moment of force", "Centripetal force"], a: 2, e: "Moment of force (or torque) is what causes a body to turn.", n: "When a force acts on a body that is fixed at a pivot, it naturally induces rotation rather than straight-line movement. This exact rotational tendency is termed the turning effect or moment of force. The magnitude of this effect relies heavily on where the force is applied relative to the pivot. Maximizing the distance from the pivot drastically amplifies the turning effect. This concept is why door handles are placed far from their hinges." },
                    { q: "Which direction is taken as positive for moment of force?", o: ["Clockwise", "Anticlockwise", "Upwards", "Downwards"], a: 1, e: "By standard convention in physics, anticlockwise moments are positive.", n: "Standard mathematical and physics conventions assign a positive value to anticlockwise rotations. Conversely, clockwise rotations are consistently treated as negative values. This strict sign convention aligns beautifully with the standard Cartesian coordinate system used in geometry. Adhering to this universally accepted rule prevents confusion when calculating net moments. It ensures scientists and engineers worldwide speak the same mathematical language." },
                    { q: "Two equal and opposite parallel forces not acting along the same line form a:", o: ["Couple", "Thrust", "Pressure", "Weight"], a: 0, e: "A couple consists of two equal, opposite, and non-collinear forces.", n: "A couple is a unique mechanical system formed by two parallel forces of equal magnitude acting in opposite directions. Because the forces are equal and opposite, they perfectly cancel out any translational movement. Instead, their separated lines of action guarantee pure rotational motion. Steering a car or turning a water tap are perfect everyday examples of applying a couple. They are essential for producing rotation without pushing the object sideways." },
                    { q: "A couple produces:", o: ["Translational motion", "Rotational motion", "Both", "No motion"], a: 1, e: "A couple only causes turning (rotation); it does not move the body in a straight line.", n: "Because the two forces in a couple have a net sum of zero, they completely fail to produce translational acceleration. However, their displaced lines of action combine their individual turning effects into a powerful rotational drive. This results in the object spinning around a central axis without shifting its absolute position in space. This concept is vital for designing motors, gears, and steering mechanisms. It isolates rotational intent from unwanted linear shifting." },
                    { q: "The point through which the entire weight of a body acts is called:", o: ["Centre of mass", "Centre of gravity", "Geometric centre", "Pivot"], a: 1, e: "Centre of gravity is the exact point where total gravitational pull acts.", n: "Gravity pulls downwards on every individual particle that makes up a physical body. The centre of gravity represents the mathematical average point where all these tiny parallel forces combine into a single resultant weight. Supporting an object exactly at this point results in perfect, stable balance. The location of this point heavily depends on how the object's mass is distributed. Finding it is critical for ensuring the stability of vehicles and buildings." },
                    { q: "Where is the centre of gravity of a uniform ring?", o: ["On its edge", "Outside the ring", "At its centre", "Nowhere"], a: 2, e: "For a symmetrical uniform ring, the CG is at its geometric centre (in empty space).", n: "A uniform ring boasts perfect radial symmetry regarding its mass distribution. Consequently, the balancing point where gravitational pull averages out falls perfectly in the center. Interestingly, this point exists completely in the empty space, outside the physical material of the ring itself. This perfectly illustrates that the centre of gravity is a mathematical concept rather than a physical part of the object. Similar principles apply to hollow spheres and empty cups." },
                    { q: "Where is the centre of gravity of a uniform solid sphere?", o: ["On its surface", "At its geometric centre", "At the bottom", "At the top"], a: 1, e: "A perfectly uniform sphere balances exactly at its geometric centre.", n: "A solid uniform sphere distributes its mass equally in every three-dimensional direction from its core. As gravity pulls down evenly on all these matching sectors, the resultant force naturally converges precisely at the geometric center. This makes calculations involving spheres incredibly straightforward in physics. A sphere behaves mechanically as if all its mass were concentrated at that single central point. This is why planets are often modeled as point masses in orbital mechanics." },
                    { q: "The force that acts towards the centre of a circular path is:", o: ["Centrifugal force", "Centripetal force", "Gravitational force", "Frictional force"], a: 1, e: "Centripetal means 'centre-seeking'.", n: "According to Newton's first law, a body in motion prefers to travel in a straight, unbending line. To force an object into a curved circular path, an external force must continuously pull it inwards. This vital inward-directed force is known universally as centripetal force. It can be provided by tension in a string, friction on a road, or gravity in space. Without it, the object would instantly fly off tangentially." },
                    { q: "In uniform circular motion, speed is:", o: ["Variable", "Zero", "Constant", "Increasing"], a: 2, e: "The word 'uniform' means the magnitude of speed does not change.", n: "Uniform circular motion specifically describes an object travelling along a circular path at a steady, unchanging pace. The term 'uniform' acts as a strict guarantee that the scalar magnitude of movement (speed) remains locked. However, this does not imply the object's physical state is completely constant. Because the pathway is curved, the directional orientation is in a state of constant flux. Therefore, uniform speed exists simultaneously with variable velocity." },
                    { q: "In uniform circular motion, velocity is:", o: ["Constant", "Variable", "Zero", "Decreasing"], a: 1, e: "Velocity changes because the direction of motion changes continuously.", n: "Velocity is a definitive vector quantity, requiring both a specific speed magnitude and a strict directional heading. In any circular path, the object's actual direction of travel is shifting tangentially at every millisecond. Even if the speedometer reading remains perfectly static, this directional shift guarantees the overall velocity vector is variable. This continuous change in velocity proves the object is undergoing continuous acceleration. This acceleration is always directed towards the circle's center." },
                    { q: "What provides the centripetal force for the earth to orbit the sun?", o: ["Friction", "Electrostatic force", "Gravitational force", "Magnetic force"], a: 2, e: "The sun's gravity pulls the earth, keeping it in a circular path.", n: "Celestial bodies like the Earth require a massive, continuous inward pull to prevent them from drifting into deep space. The Sun's immense gravitational field perfectly supplies this necessary centripetal force. This invisible tether of gravity reaches across millions of miles of vacuum to act on the planet. It pulls the Earth perpendicular to its forward momentum, bending its path into an elliptical orbit. This elegant balance is the foundation of our solar system." },
                    { q: "A fictitious outward force in circular motion is called:", o: ["Centripetal force", "Centrifugal force", "Tension", "Weight"], a: 1, e: "Centrifugal force is a 'pseudo' or fictitious force felt in a rotating frame.", n: "When riding a fast-spinning merry-go-round, you undeniably feel a strong push attempting to throw you off radially. However, classical physics categorizes this centrifugal force as a 'fictitious' or apparent force. It doesn't actually exist as a true external push; rather, it's merely your body's own inertia resisting the inward centripetal pull. You feel pushed out simply because your body wants to travel in a straight line. It only exists within the perspective of the rotating observer." },
                    { q: "The centre of gravity of a uniform metre rule is at the:", o: ["0 cm mark", "50 cm mark", "100 cm mark", "25 cm mark"], a: 1, e: "A uniform scale balances exactly in the middle.", n: "A uniform metre rule implies the wood or plastic is perfectly consistent in density and width from end to end. Because the mass is distributed with flawless symmetry, the balance point naturally rests at the exact geometric midpoint. For a 100 cm ruler, this translates precisely to the 50 cm mark. Supporting the ruler at this distinct point ensures clockwise and anticlockwise moments cancel out perfectly. It allows the ruler to sit in perfect horizontal equilibrium." },
                    { q: "Which of these is necessary to open a door?", o: ["Only force", "Moment of force", "Centripetal force", "Weight"], a: 1, e: "Opening a door requires turning it around its hinges, which is a moment.", n: "A door operates primarily by rotating around a fixed vertical axis created by its hinges. Pushing on a door with a straight, linear force only works because that force acts at a distance from those hinges. This combination of force and distance generates the necessary moment of force (torque) to swing the wood. Pushing directly directly into the hinges themselves produces zero turning effect. Therefore, the moment is the true mechanical requirement for opening." },
                    { q: "Moment of force = Force × ?", o: ["Time", "Velocity", "Perpendicular distance", "Mass"], a: 2, e: "The formula is Force multiplied by the perpendicular distance from the pivot.", n: "The foundational equation for calculating the turning effect of a force is straightforward but strict. You must multiply the magnitude of the applied force by the perpendicular distance from the pivot point to the force's line of action. If the distance is measured at an angle, the resulting calculation will be mechanically incorrect. This emphasizes that both the size of the push and its geometric orientation dictate the final rotation. It is a cornerstone concept in structural engineering." },
                    { q: "The CG of a uniform solid cone is at what height from its base (total height h)?", o: ["h/2", "h/3", "h/4", "h/5"], a: 2, e: "A solid cone's weight is concentrated lower down, at exactly h/4.", n: "A solid cone is significantly wider and more massive at its base compared to its narrowing tip. Because of this heavy bottom-loading, the mathematical average of its mass sits quite low on its vertical axis. Specifically, the centre of gravity rests at exactly one-quarter (h/4) of the total height up from the circular base. This low center of gravity grants solid conical objects an incredibly high degree of physical stability. It makes them exceptionally difficult to tip over." },
                    { q: "Is the earth's orbit around the sun an accelerated motion?", o: ["Yes", "No", "Only in summer", "Cannot say"], a: 0, e: "Because its direction changes constantly, its velocity changes, meaning it accelerates.", n: "Acceleration in physics is strictly defined as any distinct change in a body's velocity vector over time. Velocity inherently includes both a speed component and a directional component. Because the Earth travels in a curved orbit, its heading in space changes every single second of the year. This continuous directional shift means its velocity is never constant, mathematically proving it is constantly accelerating. This acceleration is caused entirely by the Sun's gravity." },
                    { q: "If a body is pivoted at a point, it will rotate if:", o: ["Line of action of force passes through pivot", "Line of action does not pass through pivot", "Force is zero", "Distance is zero"], a: 1, e: "There must be a perpendicular distance between the pivot and the force to turn.", n: "Rotation absolutely requires the generation of a turning effect, physically known as a moment. For a moment to exist, the applied force must possess a non-zero perpendicular distance from the central pivot. If you push straight towards or pull straight away from the hinge, the line of action passes dead through it. This zeroes out the distance, mathematically guaranteeing a zero moment and zero rotation. A displaced line of action is biologically and mechanically mandatory." },
                    { q: "Which tool uses the principle of moments?", o: ["A simple lever", "A battery", "A lens", "A thermometer"], a: 0, e: "A lever balances moments on either side of the fulcrum.", n: "The simple lever operates entirely on the fundamental physical principle of balancing opposing moments. By placing a pivot (fulcrum) strategically between an effort and a load, it allows mechanical advantage to be manipulated. A small force applied at a massive distance can perfectly equalize a massive load sitting at a tiny distance. This principle was famously understood by Archimedes in ancient times. It remains the foundation of practically all heavy lifting machinery." },
                    { q: "Can the centre of gravity lie outside the material of the body?", o: ["Yes", "No", "Only in space", "Only in liquids"], a: 0, e: "Yes, for objects like a ring or an empty cup, the CG is in the hollow space.", n: "The centre of gravity is a strictly theoretical coordinate representing the mean position of an object's weight. It does not demand to be located within solid physical matter. For objects possessing hollow or concave geometries, such as a wedding ring or an inflated balloon, the mass distribution balances out in the central void. This conceptual understanding is critical when designing complex, non-solid structures. The invisible point heavily dictates how the structure will balance and rotate." },
                    { q: "What is the C.G.S unit of force?", o: ["Newton", "Dyne", "Erg", "Joule"], a: 1, e: "Dyne is the centimeter-gram-second (CGS) unit of force.", n: "Before the universal adoption of the modern SI metric system, scientists frequently utilized the CGS framework. In this older system, length is measured in centimeters and mass in grams. Consequently, the standard unit of force is the dyne, defining the push needed to accelerate one gram by one centimeter per second squared. It represents a remarkably tiny amount of force. Although largely replaced by the Newton, the dyne is still occasionally referenced in specialized scientific fields." },
                    { q: "1 Newton is equal to how many dynes?", o: ["10^3", "10^4", "10^5", "10^6"], a: 2, e: "1 N = 100,000 dynes (10^5).", n: "A Newton accelerates a full kilogram (1000 grams) by a full meter (100 centimeters) per second squared. To convert this into the smaller CGS units, you multiply the mass factor (10^3) by the distance factor (10^2). This calculation precisely yields a massive conversion factor of 100,000. Therefore, a single Newton is identically equal to 10^5 dynes. This relationship elegantly bridges the gap between modern and historical physical measurements." },
                    { q: "Translational motion occurs when a force acts on a:", o: ["Pivoted body", "Free rigid body", "Fixed body", "Rotating body"], a: 1, e: "If a body is free to move and not tied down, a force will push it in a straight line.", n: "A completely free rigid body is untethered by hinges, pivots, or locking mechanisms. When a single external force is applied directly to such a body, it immediately induces movement in a linear, forward direction. This straight-line journey through space is formally classified as translational motion. If the force happens to act off-center, the body might undergo a combination of translation and rotation simultaneously. However, pure translation is the hallmark of unpivoted force application." },
                    { q: "The handles of doors are provided at the free end to:", o: ["Decrease force needed", "Increase force needed", "Look good", "Decrease moment"], a: 0, e: "Maximum distance from the hinge gives maximum moment with minimum force.", n: "Architectural design inherently applies the physical principle of moments to ensure user comfort. By placing a door handle at the extreme edge opposite the hinges, the perpendicular distance is mathematically maximized. According to the moment equation (Force x Distance), this large distance requires drastically less physical effort to generate the necessary turning effect. Moving the handle toward the middle would stubbornly double the physical effort required by the user. It represents a perfect marriage of physics and ergonomic design." },
                    { q: "A spanner has a long handle to:", o: ["Increase the effort", "Produce larger turning effect", "Decrease the distance", "Look bigger"], a: 1, e: "Longer handle = longer distance = larger turning effect (moment) for the same force.", n: "Mechanical tools like spanners and wrenches are purpose-built to exploit torque. A stubbornly tight nut requires a massive moment of force to break its static friction. Extending the handle of the tool linearly increases the perpendicular distance available to the mechanic's hand. This geometric extension dramatically multiplies the turning effect without demanding superhuman physical strength. It is the purest practical application of lever mechanics." },
                    { q: "In equilibrium, the sum of clockwise moments is equal to:", o: ["Zero", "Sum of forces", "Sum of anticlockwise moments", "Weight"], a: 2, e: "This is the principle of moments for a balanced body.", n: "For any rigid body to exist in a state of perfect rotational rest, it must satisfy the principle of moments. This foundational law demands that every turning effect attempting to spin the object right (clockwise) must be mathematically neutralized. They are neutralized by equal and opposite turning effects pulling left (anticlockwise). When these opposing torque totals are perfectly equal, the net rotation is locked at zero. This principle is what keeps see-saws balanced and massive cranes from tipping." },
                    { q: "Centripetal force acts:", o: ["Along the tangent", "Away from centre", "Towards the centre", "Upwards"], a: 2, e: "It constantly pulls the object inward towards the center.", n: "The very word 'centripetal' is derived from Latin, translating literally to 'seeking the center'. In any form of circular motion, the moving object naturally wants to fly away in a straight tangential line. To combat this inertia, a dominating force must continuously yank the object inward, perpendicular to its forward travel. This constant inward correction successfully bends the object's path into a smooth, continuous circle. It acts as an invisible leash." },
                    { q: "What kind of force is required to keep a stone whirling in a circle?", o: ["Centrifugal", "Centripetal", "Magnetic", "Frictional"], a: 1, e: "You must constantly pull the string inward (centripetal force) to keep it turning.", n: "When a stone is spun on a string, the tension within the string provides the critical mechanical tether. This tension forcefully pulls the stone inwards toward the spinner's hand at all times. This inward directional pull serves strictly as the necessary centripetal force. The moment the string is cut, this center-seeking force drops to zero. Consequently, the stone ceases circular motion and immediately flies off in a straight tangential line." },
                    { q: "A steering wheel of a car is turned by applying a:", o: ["Single force", "Couple", "Centripetal force", "Friction"], a: 1, e: "Two hands apply equal, opposite, parallel forces to turn the wheel.", n: "Properly steering a vehicle involves placing two hands on opposite edges of the circular steering column. To initiate a turn, one hand pushes forcefully upwards while the opposing hand pulls forcefully downwards. These two forces are equal in magnitude, strictly parallel, yet act in perfectly opposite directions. This exact mechanical setup generates a powerful torque known as a 'couple'. It efficiently spins the wheel on its central axis without attempting to rip the column from the dashboard." },
                    { q: "The turning effect depends on the magnitude of the force and its:", o: ["Mass", "Perpendicular distance", "Speed", "Volume"], a: 1, e: "Moment = Force × Perpendicular distance.", n: "Calculating a moment requires assessing two equally critical physical variables. The first is the raw magnitude of the force being applied to the object. The second, and equally important, is the perpendicular distance between the pivot axis and the force's line of action. Altering either of these factors directly and proportionally alters the final turning effect. A massive force at zero distance is just as useless as zero force at a massive distance." },
                    { q: "If the perpendicular distance is zero, the moment of force is:", o: ["Maximum", "Zero", "Negative", "One"], a: 1, e: "Anything multiplied by zero is zero.", n: "The equation for torque dictates that Moment equals Force multiplied by Distance. If the force's line of action aims directly at the pivot point, the geometric distance between them drops entirely to zero. Mathematically, multiplying even an astronomically large force by zero inevitably yields a zero moment. Physically, this means pushing directly on a hinge will never cause the door to swing. It perfectly demonstrates why force placement is as crucial as force magnitude." },
                    { q: "A body is in rotational equilibrium if:", o: ["Net force is zero", "Net moment is zero", "Velocity is zero", "Mass is zero"], a: 1, e: "Rotational equilibrium means it is not turning, so the net turning effect (moment) is zero.", n: "Equilibrium is a state of physical balance where an object strongly resists changes to its current motion. Specifically, rotational equilibrium dictates that the object's rotational speed remains completely static. This requires that every single twisting influence (torque) acting on the body perfectly cancels out. When the algebraic sum of all moments equals zero, the body will not start spinning, nor will a spinning body change its RPM. It is a state of perfect mechanical harmony." },
                    { q: "The centre of gravity of a uniform parallelogram is at:", o: ["Its corners", "Intersection of diagonals", "Midpoint of sides", "Outside it"], a: 1, e: "It balances exactly at the center where the two diagonals cross.", n: "A uniform flat shape, known as a lamina, distributes its mass perfectly evenly across its geometric area. For a symmetrical shape like a parallelogram, the distribution inherently points toward the absolute center. By drawing two diagonal lines connecting the opposing corners, you locate this precise geometric midpoint. This intersection serves as the exact coordinate for the centre of gravity. Supporting the shape at this microscopic point allows it to balance flawlessly in mid-air." },
                    { q: "The gravitational force of the earth on a body is called its:", o: ["Mass", "Weight", "Volume", "Density"], a: 1, e: "Weight is the downward pull of gravity.", n: "Mass represents the absolute quantity of matter contained within an object, which remains static universally. Weight, however, is a dynamic force representing how aggressively the Earth's gravity pulls on that specific mass. It is calculated by multiplying the mass by the local acceleration due to gravity (W=mg). Because it relies on gravity, an object's weight can drastically change depending on its altitude or planetary location. It is a fundamental force pushing downwards toward the planetary core." },
                    { q: "To loosen a tight nut, a spanner should have a:", o: ["Short handle", "Long handle", "Heavy handle", "Light handle"], a: 1, e: "A long handle provides a larger perpendicular distance, creating a larger moment.", n: "A severely tightened nut possesses immense static friction resisting any rotational movement. Overcoming this resistance demands the application of a massive turning moment. Utilizing a spanner with a highly elongated handle massively increases the perpendicular distance variable in the torque equation. This allows the mechanic to apply a surprisingly small physical force while still generating the necessary massive rotation. It cleverly uses geometry to substitute for raw physical power." },
                    { q: "The unit 'kgf m' is used to measure:", o: ["Energy", "Work", "Moment of force", "Power"], a: 2, e: "Kilogram-force meter is an alternative gravitational unit for moment of force.", n: "While the Newton-meter (N m) serves as the strict, universally accepted SI unit for moments, practical engineering frequently employs alternative metrics. The Kilogram-force meter (kgf m) is a prominent gravitational unit historically used in mechanical fields. It fundamentally measures the turning effect generated by a one-kilogram mass resting at a distance of one meter. It is incredibly useful for providing intuitive, real-world context to torque values. It directly translates twisting force into relatable weights." }
                ]
            },
            ch2: {
                title: "Chapter 2: Work & Energy (Easy Level)",
                questions: [
                    { q: "What is the SI unit of work?", o: ["Newton", "Joule", "Watt", "Pascal"], a: 1, e: "Joule (J) is the standard SI unit for both work and energy.", n: "The Joule is named after the eminent English physicist James Prescott Joule. It is strictly defined as the amount of work done when a force of one Newton displaces an object by one meter. Because doing work necessitates the transfer of energy, the Joule is logically used to measure both concepts. This unified metric elegantly links mechanical action to thermal and electrical energy states. It is a cornerstone of modern thermodynamic calculations." },
                    { q: "Work is said to be done when a force produces:", o: ["Rest", "Displacement", "Mass", "Heat"], a: 1, e: "Work is only done if the force actually moves the object.", n: "In the strict realm of physics, mental exhaustion or static pushing does not qualify as mechanical work. Work demands visible, physical results. A force must successfully overcome resistance and induce a measurable displacement in the object's position. If you aggressively push a concrete wall for an hour but the wall remains stationary, your mechanical work is mathematically zero. Force without movement equates to wasted effort in physics." },
                    { q: "What is the SI unit of Energy?", o: ["Joule", "Watt", "Newton", "Volt"], a: 0, e: "Energy is the capacity to do work, so it has the same unit as work (Joule).", n: "Energy is fundamentally defined as the inherited capacity or potential to execute mechanical work. Whenever work is performed on an object, a strict transfer of energy occurs seamlessly. Because these two concepts are two sides of the identical physical coin, they naturally share the exact same metric unit. Measuring energy in Joules allows physicists to easily track how much potential can be converted into actual movement. It ensures mathematical consistency across physical laws." },
                    { q: "What is the SI unit of Power?", o: ["Joule", "Watt", "Newton", "Ohm"], a: 1, e: "Power is the rate of doing work, measured in Watts (Joules per second).", n: "Power acts as the universal speedometer for energy transfer and mechanical work. It measures exactly how rapidly Joules are being burned or generated over time. The SI unit honoring this rate is the Watt, named after the brilliant steam engine innovator James Watt. Specifically, one Watt translates to the transfer of one Joule of energy every single second. This metric is vital for evaluating the efficiency and capability of engines and electrical appliances." },
                    { q: "Energy possessed by a moving body is called:", o: ["Potential Energy", "Kinetic Energy", "Chemical Energy", "Heat Energy"], a: 1, e: "Kinetic energy is the energy of motion.", n: "The term 'kinetic' stems from the ancient Greek word 'kinesis', which directly translates to motion. Any object possessing mass that is actively travelling through space inherently carries this form of dynamic energy. The amount of kinetic energy surges exponentially as the object's velocity increases, making fast-moving objects incredibly energetic. This energy is capable of performing massive amounts of work upon impact, such as a speeding hammer driving a nail. It is the pure energy of active travel." },
                    { q: "Energy possessed by a body due to its position or shape is called:", o: ["Kinetic Energy", "Potential Energy", "Light Energy", "Sound Energy"], a: 1, e: "Potential energy is stored energy based on where an object is or its shape.", n: "Potential energy acts as a hidden reservoir of stored physical capacity. It exists not because the object is moving, but simply because of its current location or structural deformation. For instance, lifting a heavy boulder high against gravity stores immense gravitational potential energy. Similarly, stretching a thick rubber band stores robust elastic potential energy within its polymers. This energy silently waits to be unleashed back into active kinetic motion." },
                    { q: "The formula for Work done is:", o: ["W = F + d", "W = F / d", "W = F × d", "W = d / F"], a: 2, e: "Work equals Force multiplied by displacement in the direction of the force.", n: "The fundamental equation for determining mechanical work establishes a direct multiplication relationship. You simply calculate the product of the active force applied and the total linear displacement achieved by the object. Crucially, the calculation demands that the displacement measured is strictly in the same direction that the force is pointing. If the force pushes at an angle, trigonometric adjustments (using cosines) become necessary. This formula remains the bedrock of analyzing mechanical effort." },
                    { q: "Power is defined as:", o: ["Force × distance", "Rate of doing work", "Mass × acceleration", "Energy stored"], a: 1, e: "Power is how fast work is done (Work / Time).", n: "Power transcends the simple measurement of how much total work was accomplished. It specifically analyzes the timeframe required to finalize that specific task. A weak motor might eventually accomplish the exact same total work as a massive industrial engine, given enough time. However, the massive engine possesses far superior power because it completes the identical task in a fraction of the seconds. Power is the ultimate measure of energetic speed." },
                    { q: "Kinetic energy of a body depends on its mass and:", o: ["Height", "Velocity", "Time", "Temperature"], a: 1, e: "The formula is KE = 1/2 mv^2, so it depends on mass and velocity.", n: "The mathematical formula defining kinetic energy (K = ½mv²) explicitly requires two critical variables. While the object's static mass contributes linearly to the final energy output, its velocity plays a much more dominant role. Because the velocity variable is squared in the equation, even slight increases in speed cause explosive growth in kinetic energy. This exponential relationship is precisely why high-speed vehicular crashes are exponentially more devastating than slow-speed impacts. Speed truly defines dynamic energy." },
                    { q: "Gravitational Potential energy depends on mass, gravity, and:", o: ["Velocity", "Time", "Height", "Distance"], a: 2, e: "The formula is PE = mgh, so height is the key factor.", n: "Gravitational potential energy (U = mgh) is the energy stored by lifting an object against the relentless pull of the Earth. The formula directly multiplies the object's mass, the constant of planetary gravity, and the vertical height achieved. Because mass and gravity remain relatively constant in everyday scenarios, the vertical height serves as the primary variable you can actively control. Hoisting a boulder twice as high literally doubles its stored, destructive potential. It acts as an energetic battery." },
                    { q: "According to the law of conservation of energy, energy can neither be created nor:", o: ["Used", "Transformed", "Destroyed", "Stored"], a: 2, e: "Energy can only change forms, it cannot be destroyed.", n: "The law of conservation of energy stands as one of the most unbreakable pillars of modern physics. It decrees that the absolute total energy within an isolated system is a fixed, unchangeable constant. You cannot magically conjure new energy from nothing, nor can you completely erase existing energy from reality. You are strictly limited to transforming it from one classification to another, such as turning chemical fuel into thermal heat. The universal balance sheet always remains perfectly zeroed." },
                    { q: "A stretched bow possesses which type of energy?", o: ["Kinetic", "Elastic Potential", "Gravitational Potential", "Chemical"], a: 1, e: "Changing the shape of the bow stores elastic potential energy.", n: "When an archer forcibly draws back the string of a bow, they are actively performing mechanical work on the flexible limbs. This effort physically deforms the structure, safely packing the transferred energy into the material as elastic potential energy. The moment the archer releases their grip, the bow violently snaps back to its original shape. This sudden structural recovery instantly converts the stored elastic reservoir into explosive kinetic energy, launching the arrow. It is a perfect mechanism for energy delay." },
                    { q: "Water stored in a dam possesses:", o: ["Kinetic Energy", "Potential Energy", "Electrical Energy", "Heat Energy"], a: 1, e: "It is stored at a height, so it has gravitational potential energy.", n: "A hydroelectric dam acts as a colossal, landscape-sized energy battery. By trapping millions of gallons of water at a significant vertical height, the dam successfully stockpiles an unimaginable reservoir of gravitational potential energy. This water sits motionless, holding massive stored capacity solely due to its elevated position against gravity. When the sluice gates finally open, this waiting potential instantly violently converts into roaring kinetic energy. This rushing force is what ultimately powers the massive electrical turbines." },
                    { q: "When a stone is thrown upwards, its Kinetic Energy:", o: ["Increases", "Decreases", "Remains same", "Becomes negative"], a: 1, e: "As it goes up, it slows down, so its KE decreases (turning into PE).", n: "The moment a stone leaves your hand flying vertically upward, it possesses its absolute maximum speed and kinetic energy. However, the relentless downward drag of Earth's gravity immediately begins decelerating the stone. As its upward velocity steadily dwindles, its kinetic energy gracefully evaporates, converting directly into rising gravitational potential energy. At the very apex of its flight, its velocity hits zero, meaning its kinetic energy has been entirely drained and transformed. It represents a beautiful, invisible energy exchange." },
                    { q: "An electric bulb converts electrical energy into:", o: ["Heat and Light", "Sound", "Mechanical", "Chemical"], a: 0, e: "A bulb's purpose is to give light, and it also produces heat as a byproduct.", n: "An traditional incandescent light bulb operates by forcing a heavy electrical current through a remarkably thin tungsten filament. The intense resistance generated causes the filament to heat up so aggressively that it glows brilliantly white. While the engineered goal is to harvest the resulting light energy, a massive percentage of the input is inevitably lost as thermal radiation. This makes traditional bulbs notoriously inefficient energy transformers. Modern LEDs accomplish the same lighting goal with drastically less wasteful heat generation." },
                    { q: "A loud speaker converts electrical energy into:", o: ["Light energy", "Heat energy", "Sound energy", "Chemical energy"], a: 2, e: "It takes electrical signals and turns them into sound waves we can hear.", n: "The core function of an audio speaker is to bridge the gap between digital electronics and the physical atmosphere. It receives complex, rapidly fluctuating electrical signals from an amplifier. Utilizing a powerful internal electromagnet, these signals force a flexible diaphragm to vibrate aggressively back and forth. These rapid mechanical vibrations strike the surrounding air, creating the precise pressure waves that human ears recognize as sound. It is a masterful transducer of energy." },
                    { q: "A solar cell converts light energy into:", o: ["Heat energy", "Electrical energy", "Mechanical energy", "Sound energy"], a: 1, e: "Solar panels (photovoltaic cells) generate electricity from sunlight.", n: "Solar cells leverage the fascinating photovoltaic effect to harvest free energy from the sky. When aggressive photons of sunlight strike the specially engineered semiconductor materials, they violently knock electrons completely loose from their atomic orbits. This sudden liberation of electrons creates a steady, directional flow of electrical current across the panel. By capturing this flow, solar panels elegantly and silently convert raw light radiation directly into usable electricity. It is the backbone of the green energy revolution." },
                    { q: "1 Horsepower (H.P.) is equal to:", o: ["100 W", "746 W", "1000 W", "500 W"], a: 1, e: "1 H.P. is a traditional unit of power equal to exactly 746 Watts.", n: "Before the universal adoption of the metric Watt, engineers needed a relatable metric to sell steam engines to farmers. James Watt himself popularized the 'Horsepower' to compare his new machines directly against the drafting capabilities of strong draft horses. Through meticulous testing, it was established that one horsepower mathematically translates to approximately 746 Watts of mechanical power. Despite being an archaic imperial unit, it remains culturally dominant in evaluating automotive and heavy machinery performance today." },
                    { q: "If displacement is zero, the work done is:", o: ["Maximum", "Zero", "Negative", "One"], a: 1, e: "If an object doesn't move (d=0), no work is done regardless of the force applied.", n: "The strict physical definition of work is unyielding: no movement means no work. You can apply Herculean force against a concrete wall until you collapse from total physical exhaustion. However, because the wall's structural displacement remained stubbornly at zero (d=0), the mathematical output of the work equation (W=Fd) is unequivocally zero Joules. While your biological muscles undoubtedly expended chemical energy, zero mechanical energy was successfully transferred to the wall. Effort does not always equal work." },
                    { q: "Which of the following is a non-renewable source of energy?", o: ["Wind", "Solar", "Coal", "Water"], a: 2, e: "Coal is a fossil fuel that takes millions of years to form and will eventually run out.", n: "Non-renewable energy sources are natural resources that humanity extracts and burns significantly faster than the Earth can ever hope to replenish them. Coal is a prime example, formed deep underground over hundreds of millions of years from decaying prehistoric forests. Once a seam of coal is excavated and incinerated for power, it is permanently erased from the planet's inventory. Because this supply is strictly finite, relying heavily on non-renewables guarantees an eventual global energy crisis. They also heavily contribute to atmospheric pollution." },
                    { q: "Which of the following is a renewable source of energy?", o: ["Petroleum", "Natural Gas", "Wind", "Coal"], a: 2, e: "Wind is constantly replenished by nature and will not run out.", n: "Renewable energy sources harness natural, ongoing planetary processes that possess a practically infinite lifespan. Wind energy is generated entirely by the sun unevenly heating the Earth's atmosphere, causing continuous, massive air currents. Because the sun will shine for billions of years, the wind will continue to blow indefinitely, making it a perfectly sustainable resource. Harvesting it with turbines does not deplete the global supply of air currents. It offers a clean, inexhaustible alternative to finite fossil fuels." },
                    { q: "The commercial unit of electrical energy is:", o: ["Watt", "Joule", "Kilowatt-hour (kWh)", "Newton"], a: 2, e: "Electricity bills are calculated based on 'units', where 1 unit = 1 kWh.", n: "While the Joule serves perfectly as the standard scientific unit for energy, it represents an annoyingly tiny amount for household use. To make residential electricity billing practical, power companies utilize the Kilowatt-hour (kWh). One kWh represents the massive amount of energy consumed if you ran a powerful 1000-Watt appliance continuously for an entire hour. This equates to a staggering 3.6 million Joules. On your monthly utility statement, 'one unit' of electricity is exactly one kWh." },
                    { q: "1 Kilowatt (kW) is equal to:", o: ["10 W", "100 W", "1000 W", "10000 W"], a: 2, e: "The prefix 'kilo' means one thousand.", n: "The International System of Units (SI) utilizes standardized prefixes to gracefully handle exceptionally large or microscopic numbers. The well-known prefix 'kilo' always and strictly denotes a multiplication factor of one thousand. Therefore, upgrading from a standard Watt to a Kilowatt (kW) simply implies a package of 1,000 Watts. This prefix system allows engineers to discuss high-power equipment, like a 2kW kettle, without drowning in excessive zeroes. It keeps technical communication clean and efficient." },
                    { q: "Work is a:", o: ["Vector quantity", "Scalar quantity", "Fundamental quantity", "Unitless quantity"], a: 1, e: "Work has magnitude but no specific direction, making it a scalar.", n: "In physics, scalar quantities are delightfully simple because they are entirely defined by a single numerical magnitude. Work fits perfectly into this category because it merely represents an abstract amount of energy successfully transferred. It is completely nonsensical to state that you did 50 Joules of work 'North' or 'East'. Because it entirely lacks any directional heading, it cannot be classified as a vector. It just sits as a raw, directionless numerical value." },
                    { q: "Energy is a:", o: ["Vector quantity", "Scalar quantity", "Derived force", "Negative quantity"], a: 1, e: "Like work, energy only has magnitude and no direction.", n: "Energy, precisely like the mechanical work it produces, operates strictly as a scalar quantity. It serves as a universal accounting system representing an object's raw potential to induce change or movement. You can possess a massive 500 Joules of stored potential energy, but that energy lacks any inherent spatial heading until it is actively unleashed. It merely exists as a static, measurable reservoir of power. Its complete lack of direction fundamentally separates it from vector forces like momentum." },
                    { q: "A coolie carrying a load and standing still does:", o: ["Maximum work", "Zero work", "Negative work", "Positive work"], a: 1, e: "Because he is standing still, his displacement is zero, so work done is zero.", n: "A coolie balancing a heavy trunk on his head while stationary is undoubtedly enduring severe biological exhaustion. His muscles are burning calories and desperately fighting the downward pull of gravity to maintain the static position. However, the rigid laws of physics completely ignore biological effort in favor of mechanical results. Because the heavy trunk experiences absolutely zero spatial displacement, the work equation yields a merciless zero. In physics, maintaining a position achieves zero mechanical progress." },
                    { q: "Mechanical energy is the sum of:", o: ["Heat and Light", "Kinetic and Potential Energy", "Work and Power", "Force and Mass"], a: 1, e: "Total mechanical energy = KE + PE.", n: "Mechanical energy encompasses the absolute total energetic capability of a physical system regarding its motion and positioning. It is calculated by cleanly adding the object's active kinetic energy to its stored potential energy. As an object moves, such as a roller coaster cresting and dropping, these two forms constantly wildly trade values. However, barring severe friction, their combined sum—the total mechanical energy—remains a stubborn constant. This sum dictates exactly how much physical work the system can accomplish." },
                    { q: "What energy transformation occurs in a microphone?", o: ["Electrical to Sound", "Sound to Electrical", "Heat to Light", "Mechanical to Heat"], a: 1, e: "You speak into it (sound), and it sends a signal through the wire (electrical).", n: "A microphone functions as a highly sensitive energetic gateway, translating physical acoustics into digital data. When you speak, your voice generates aggressive sound waves that crash into the microphone's delicate internal diaphragm. This acoustic impact forces the diaphragm to vibrate, which subsequently manipulates a tiny magnetic field to induce a fluctuating electrical current. This brilliant conversion turns physical sound energy directly into a perfectly mirrored electrical signal. That signal can then be easily recorded, amplified, or broadcast worldwide." },
                    { q: "An electric motor converts:", o: ["Mechanical to Electrical", "Electrical to Mechanical", "Heat to Mechanical", "Light to Electrical"], a: 1, e: "You plug it in (electrical) to make it spin (mechanical).", n: "The electric motor is arguably the most transformative invention of the industrial revolution. Its singular purpose is to consume a steady input of electrical current and violently translate it into aggressive rotational movement. By leveraging the repulsive forces of internal electromagnets, the electricity forces a central shaft to spin rapidly. This pure conversion of electrical energy into raw, driving mechanical energy powers our modern world. It is the heart beating inside everything from tiny computer fans to massive electric trains." },
                    { q: "A dynamo (generator) converts:", o: ["Electrical to Mechanical", "Mechanical to Electrical", "Chemical to Electrical", "Sound to Electrical"], a: 1, e: "You spin it (mechanical) to generate power (electrical).", n: "A dynamo operates as the exact mechanical mirror image of an electric motor. Instead of consuming electricity to spin, it demands aggressive physical spinning to generate electricity. By forcefully rotating heavy coils of wire through an intense magnetic field, the physical movement actively strips electrons and induces a powerful electrical current. This critical transformation of kinetic mechanical energy into usable electrical energy is how almost all the world's power plants operate. It turns movement into civilization." },
                    { q: "Photosynthesis converts light energy into:", o: ["Chemical energy", "Heat energy", "Mechanical energy", "Electrical energy"], a: 0, e: "Plants use sunlight to make food, storing it as chemical energy.", n: "Photosynthesis is the foundational biological engine that sustains almost all life on Earth. Plants act as living solar panels, capturing raw, incoming light energy from the sun. They utilize this captured solar power to drive complex chemical reactions, violently breaking apart water and carbon dioxide molecules. The plant then reassembles these atoms into energy-rich glucose sugar molecules, effectively storing the sunlight as solid chemical energy. This stored sugar eventually feeds the entire global food chain." },
                    { q: "A battery converts:", o: ["Electrical to Chemical", "Chemical to Electrical", "Heat to Electrical", "Light to Electrical"], a: 1, e: "Chemical reactions inside the battery produce electricity.", n: "A battery serves as a highly controlled, portable chemical containment vessel. Inside its casing, reactive materials are kept separated, desperate to balance their electron charges. When you connect a device, you open a gateway, allowing a violent internal chemical reaction to finally occur. As the chemicals transform, they aggressively shed electrons, which flow out of the battery as a steady electrical current. It represents the quiet, controlled conversion of chemical potential into electrical power." },
                    { q: "Friction always does:", o: ["Positive work", "Negative work", "Zero work", "Maximum work"], a: 1, e: "Friction acts in the opposite direction of motion, so work done by it is negative.", n: "Friction is the universe's ultimate braking mechanism, existing whenever two surfaces grind together. Its defining characteristic is that it stubbornly and exclusively applies its force in the exact opposite direction of an object's travel. Because the displacement vector and the force vector point 180 degrees away from each other, the resulting mechanical work is mathematically negative. This negative work rapidly bleeds kinetic energy away from the moving object. This lost energy is usually dissipated uselessly into the environment as heat." },
                    { q: "When a body falls freely, its potential energy:", o: ["Increases", "Decreases", "Remains constant", "Becomes zero immediately"], a: 1, e: "As it loses height, its potential energy decreases (and turns into kinetic energy).", n: "Gravitational potential energy is strictly dependent on an object's vertical altitude above the ground. The moment a freely falling object begins to plummet, it continuously sacrifices this precious altitude. Consequently, its reservoir of potential energy steadily evaporates as it drops closer to the earth. However, this energy is not lost; it seamlessly and instantly transforms into accelerating kinetic energy. By the time it impacts the ground, its potential has bottomed out." },
                    { q: "When a body falls freely, its total mechanical energy:", o: ["Increases", "Decreases", "Remains constant", "Becomes zero"], a: 2, e: "Due to conservation of energy, the sum of PE and KE stays exactly the same.", n: "In a perfect vacuum devoid of air resistance, a falling object becomes a masterclass in energy conservation. As it plunges, it bleeds gravitational potential energy but simultaneously gains the exact identical amount of kinetic energy. If you pause the fall at any microsecond and sum the two fluctuating values, the final total remains stubbornly fixed. This unwavering total represents the object's absolute mechanical energy. It perfectly illustrates that energy is shifting forms, not vanishing." },
                    { q: "Is 'Watt' a unit of energy?", o: ["Yes", "No", "Only in space", "Sometimes"], a: 1, e: "No, Watt is the unit of Power. Joule is the unit of energy.", n: "It is a frequent and frustrating misconception to confuse Watts with actual energy capacity. The Watt specifically measures 'Power', which is merely the speedometer tracking how fast energy is being consumed or delivered. The Joule is the true, concrete unit representing the actual amount of energy resting in the tank. A Watt simply tells you that one Joule is moving every single second. Confusing the two is like confusing a car's speedometer with its fuel gauge." },
                    { q: "If you do the same amount of work in less time, your power is:", o: ["More", "Less", "Same", "Zero"], a: 0, e: "Power is Work divided by Time. Smaller time means greater power.", n: "Power strictly evaluates the aggressive speed at which a mechanical task is finalized. The governing formula dictates dividing the total work accomplished by the total seconds it took to finish. If you suddenly sprint up a staircase instead of casually walking, the total work (lifting your weight) remains identical. However, because you brutally slashed the time denominator, your resulting power output violently spikes. Speed elevates raw work into high power." },
                    { q: "The energy of flowing water is:", o: ["Potential Energy", "Kinetic Energy", "Chemical Energy", "Heat Energy"], a: 1, e: "Because the water is moving, it possesses kinetic energy.", n: "Any entity possessing mass and actively traversing space fundamentally holds kinetic energy. A rushing river consists of millions of tons of water molecules charging aggressively downstream. This massive, coordinated movement means the water column is packed with staggering levels of kinetic energy. Historically, millers placed waterwheels directly in this flow to harvest the free movement for grinding grain. Today, we funnel it into colossal turbines to electrify entire cities." },
                    { q: "Which has more mass: a body with 10J of KE or 20J of KE (if both move at same speed)?", o: ["10J body", "20J body", "Both same", "Cannot say"], a: 1, e: "Since KE = 1/2 mv^2, if v is the same, higher KE means higher mass.", n: "The kinetic energy equation explicitly dictates that energy relies on both mass and the square of velocity. To create a fair comparison, if we rigidly lock the velocity variable to be identical for both objects, mass becomes the sole deciding factor. Therefore, the object boasting a muscular 20 Joules of energy must possess significantly more physical bulk. Specifically, it must have precisely double the mass of the 10-Joule object to generate double the energy at that identical speed. Heavy objects pack more punch." },
                    { q: "What is the CGS unit of work?", o: ["Joule", "Erg", "Dyne", "Watt"], a: 1, e: "The erg is the CGS unit of work.", n: "Before the Joule reigned supreme, the older Centimeter-Gram-Second (CGS) system relied on the 'erg' to quantify work. An erg represents the microscopic amount of work completed when one tiny dyne of force moves an object by just one centimeter. Because it is derived from such diminutive base units, an erg represents a nearly imperceptible sliver of energy. It takes exactly ten million ergs to construct a single modern Joule. It is a historical relic rarely used in large-scale modern engineering." }
                ]
            },
            ch3: {
                title: "Chapter 3: Machines (Easy Level)",
                questions: [
                    { q: "A device that makes our work easier is called a:", o: ["Machine", "Force", "Power", "Energy"], a: 0, e: "A machine is any device that overcomes resistance at one point by applying effort at another.", n: "Machines are the foundational tools of human civilization, designed to cleverly bypass our biological limitations. They do not magically erase the total work required; rather, they ingeniously manipulate how that work is performed to make it feel drastically easier. By allowing us to apply a small, comfortable effort over a long distance, they can conquer massive, stubborn loads. From a simple wooden wedge to a complex robotic crane, their primary goal is force multiplication or directional convenience. They define mechanical advantage." },
                    { q: "The force applied TO a machine is called:", o: ["Load", "Effort", "Mechanical Advantage", "Efficiency"], a: 1, e: "Effort is the input force you apply.", n: "Every machine requires an initiating physical input to awaken its mechanical potential. This intentional, driving push or pull provided by the human operator, or occasionally a motor, is officially termed the 'effort'. It represents the active investment of energy entering the system. The machine's entire purpose is to take this initial effort and mathematically transform it into a more useful output. Without this starting effort, the machine remains a useless arrangement of metal." },
                    { q: "The resistive force overcome BY a machine is called:", o: ["Effort", "Load", "Velocity Ratio", "Power"], a: 1, e: "Load is the output force or the weight being moved.", n: "The 'load' is the stubborn, resisting opponent that the machine was explicitly designed to conquer. It usually manifests as a heavy physical weight fighting against gravity, or intense friction refusing to yield. The machine acts as a specialized middleman, accepting the human's effort and utilizing it to violently battle this load. Successfully shifting the load represents the machine's final output and the completion of the desired task. Overcoming massive loads is the hallmark of a good machine." },
                    { q: "The ratio of Load to Effort is called:", o: ["Velocity Ratio", "Efficiency", "Mechanical Advantage", "Power"], a: 2, e: "M.A. = Load / Effort.", n: "Mechanical Advantage (M.A.) acts as the ultimate performance rating for any simple machine. It is a strict mathematical ratio that compares the massive load being lifted against the tiny effort required to lift it. If a machine allows you to hoist a heavy boulder using only a feather-light push, it boasts a remarkably high M.A. It vividly illustrates how successfully the machine is multiplying your raw physical input. A higher number translates to a drastically easier job." },
                    { q: "The ratio of velocity of effort to velocity of load is:", o: ["Mechanical Advantage", "Efficiency", "Velocity Ratio", "Work input"], a: 2, e: "V.R. compares how fast the effort moves compared to the load.", n: "While Mechanical Advantage tracks force, the Velocity Ratio (V.R.) strictly monitors geometry and distance. It evaluates how far your hand (effort) must frantically travel compared to how far the heavy box (load) actually rises. In force-multiplying machines, you generally have to pull yards of rope just to lift a box a few inches, creating a high V.R. This ratio is beautifully immune to the effects of friction because it is hard-coded into the machine's physical dimensions. It reveals the necessary sacrifice of distance for power." },
                    { q: "Efficiency of a machine is the ratio of:", o: ["Work output to Work input", "Load to Effort", "Work input to Work output", "Effort to Load"], a: 0, e: "Efficiency tells you how much of your input work actually became useful output work.", n: "Efficiency serves as the brutal reality check for all mechanical systems. It meticulously compares the precious energy you invested (input) against the useful work you actually received (output). A highly efficient machine successfully funnels almost all your effort into moving the load, wasting very little. Conversely, a poorly designed, rusty machine might swallow half your energy without delivering results. It is the definitive percentage grading a machine's practical usefulness." },
                    { q: "For an ideal machine, efficiency is:", o: ["Less than 100%", "Exactly 100%", "More than 100%", "0%"], a: 1, e: "An ideal machine is perfect and has zero friction, so output perfectly matches input.", n: "An 'ideal' machine is a mythical, flawless construct utilized exclusively in physics classrooms to simplify complex calculations. This theoretical device operates in a perfect universe completely devoid of energy-stealing friction or bulky, heavy moving parts. Because it loses absolutely nothing to heat or internal grinding, every single Joule of effort perfectly translates into a Joule of lifting power. Consequently, its efficiency rests permanently and perfectly at exactly 100%. Reality, sadly, never permits this perfection." },
                    { q: "In practical machines, efficiency is always:", o: ["Less than 100%", "Exactly 100%", "More than 100%", "0%"], a: 0, e: "Friction and the weight of moving parts always waste some energy.", n: "The inescapable laws of thermodynamics dictate that practical, real-world machines are inherently flawed. The moment metal grinds against metal or pulleys begin to spin, insidious friction immediately begins stealing your invested energy. This stolen energy is rapidly dissipated into the surrounding atmosphere as useless heat, completely lost to the mechanical task. Because of this unavoidable tax, the work output will perpetually remain smaller than the work input. Therefore, true efficiency is forever doomed to sit below 100%." },
                    { q: "A lever consists of a straight bar resting on a fixed point called the:", o: ["Load", "Effort", "Fulcrum", "Axis"], a: 2, e: "The fulcrum is the pivot point around which the lever turns.", n: "The fulcrum acts as the undeniable, unmoving anchor point for the entire lever system. It is the crucial hinge or pivot that forces the rigid bar to rotate rather than simply slide away. The strategic placement of this fulcrum dictates the lengths of the resulting effort and load arms. Shifting the fulcrum closer to the heavy load dramatically amplifies the user's mechanical advantage. It is the quiet center of balance that makes the lever function." },
                    { q: "In a Class I lever, what is in the middle?", o: ["Load", "Effort", "Fulcrum", "None"], a: 2, e: "The fulcrum is located between the effort and the load.", n: "The defining blueprint of a Class I lever places the stationary fulcrum directly between the user's pushing effort and the resting load. This classic 'see-saw' arrangement allows the lever to be incredibly versatile based on where the fulcrum sits. If positioned close to the load, it acts as a massive force multiplier, like a rugged crowbar. If placed perfectly in the center, it acts as a flawless neutral balance, like traditional weighing scales. It is the most universally recognizable machine." },
                    { q: "In a Class II lever, what is in the middle?", o: ["Fulcrum", "Effort", "Load", "None"], a: 2, e: "The load is located between the fulcrum and the effort.", n: "A Class II lever is structurally arranged so the heavy load sits trapped between the hinge-like fulcrum at one end and the lifting effort at the other. Because the user's hand is situated at the absolute furthest edge, the effort arm is mathematically guaranteed to be longer than the load arm. This permanent geometric advantage ensures that Class II levers are consistently and exclusively force multipliers. They exist solely to make lifting incredibly heavy objects noticeably easier. The humble wheelbarrow is the perfect example." },
                    { q: "In a Class III lever, what is in the middle?", o: ["Fulcrum", "Load", "Effort", "None"], a: 2, e: "The effort is applied between the fulcrum and the load.", n: "The Class III lever places the user's driving effort awkwardly in the middle, pinched between the rear fulcrum and the distant load at the tip. This setup completely sacrifices raw strength; the user must permanently apply far more force than the load actually weighs. However, this sacrifice is rewarded with explosive speed and massive distance covered by the load end. Swinging a baseball bat or flicking a fishing rod perfectly demonstrates this speed-multiplying effect. It sacrifices power for sweeping velocity." },
                    { q: "A pair of scissors is an example of which class of lever?", o: ["Class I", "Class II", "Class III", "Class IV"], a: 0, e: "The screw (fulcrum) is in the middle between your fingers (effort) and the paper (load).", n: "Scissors operate by utilizing two rigid blades permanently pinned together by a central screw, which acts as the fulcrum. The user inserts their fingers into the loops (effort) on one side, while the paper (load) sits waiting on the opposite side. Because the central screw strictly separates the pushing fingers from the cutting action, it flawlessly fits the Class I blueprint. Depending on the length of the blades versus the handles, they can prioritize either cutting force or cutting speed. It is an elegant double-lever system." },
                    { q: "A nutcracker is an example of which class of lever?", o: ["Class I", "Class II", "Class III", "Class IV"], a: 1, e: "The nut (load) is placed in the middle between the hinge (fulcrum) and the handles (effort).", n: "A heavy-duty nutcracker relies on a terminal hinge acting as a strong, unyielding fulcrum. The tough walnut (load) is placed directly in the crushing zone, securely between that hinge and the long, sweeping handles where the user squeezes (effort). This specific geometric arrangement mathematically forces the effort arm to be significantly longer than the load arm. This guarantees a massive multiplication of the user's squeezing force. It safely shatters the shell without requiring superhuman grip strength." },
                    { q: "Sugar tongs are an example of which class of lever?", o: ["Class I", "Class II", "Class III", "Class IV"], a: 2, e: "You squeeze the middle (effort) to pick up sugar (load) at the ends, while the back is joined (fulcrum).", n: "When using delicate sugar tongs, the two metal arms are permanently welded together at the rear, forming the stationary fulcrum. The user naturally pinches the flexible middle section to apply their gripping effort. This action successfully clamps the distant tips onto a small sugar cube, which serves as the load. Because the pinching effort occurs strictly between the rear weld and the front tips, it perfectly exemplifies a Class III lever. It trades crushing force for delicate, extended control." },
                    { q: "A single fixed pulley has a Mechanical Advantage of approximately:", o: ["1", "2", "0.5", "4"], a: 0, e: "It does not multiply force, it just changes the direction of the effort.", n: "A single fixed pulley consists of a grooved wheel stubbornly bolted to a ceiling or massive support beam. When you yank down on the rope, the heavy load on the other end rises, meaning the input effort must exactly match the output load (ignoring friction). Consequently, its Mechanical Advantage hovers stubbornly at exactly 1, proving it offers zero force multiplication. You must pull with 100 Newtons to lift a 100 Newton bucket. Its sole, brilliant purpose is to reverse the direction of your pull." },
                    { q: "The main purpose of a single fixed pulley is to:", o: ["Multiply force", "Change the direction of effort", "Multiply speed", "Increase work"], a: 1, e: "It makes work more convenient by letting you pull down instead of lifting up.", n: "Lifting a massive box straight up over your head is biologically awkward and fights against your own center of gravity. A single fixed pulley elegantly solves this by routing the lifting rope over a high, secure wheel. Now, instead of awkwardly pushing up, you can comfortably pull down, utilizing your entire body weight and gravity to assist you. While it mathematically requires the exact same raw force, the changed direction makes the biological task feel drastically easier. Convenience is its true mechanical advantage." },
                    { q: "A single movable pulley acts as a:", o: ["Speed multiplier", "Force multiplier", "Direction changer", "Work multiplier"], a: 1, e: "It has an MA of 2, meaning you only need half the effort to lift the load.", n: "Unlike its fixed cousin, a movable pulley physically rides along the rope, descending and ascending directly with the heavy load. Because the load is now beautifully supported by two distinct vertical segments of the same rope, the required lifting effort is sliced exactly in half. This makes it a highly effective force multiplier, granting a theoretical Mechanical Advantage of 2. It allows a worker to hoist a 200 Newton crate using merely 100 Newtons of pull. The trade-off is you must pull double the amount of rope." },
                    { q: "The Velocity Ratio (V.R.) of a single movable pulley is:", o: ["1", "2", "3", "0.5"], a: 1, e: "The effort rope must be pulled twice as far as the load moves up.", n: "The physics of conservation of energy demand a strict payment for the force multiplication provided by a movable pulley. Because your pulling effort is halved, you are strictly required to pull the rope over twice the distance to achieve the same vertical lift. If you desire the load to rise by 1 meter, you must frantically pull 2 full meters of rope through your hands. This geometric reality locks the Velocity Ratio (V.R.) at precisely 2. Distance is happily sacrificed for lifting power." },
